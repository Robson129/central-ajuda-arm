 e carga do PDV (Windows e Android)","https://www.youtube.com/watch?v=NueKDbe959M"]]},{"warn":"Antes de reinstalar, confirme com o suporte se há backup do banco de dados e se não há notas em contingência pendentes."}]},{"id":"saurus-dispositivos","cat":"saurus","sis":"saurus","titulo":"Testar impressora e leitor no Saurus Dispositivos","lead":"O Saurus Dispositivos é um utilitário que vem na pasta de instalação e testa os equipamentos ligados ao caixa.","tags":"saurus dispositivos teste impressora leitor código de barras sat balança","corpo":[{"steps":["Abra a pasta de instalação do Saurus PDV.","Execute o \u003cb>Saurus Dispositivos\u003c/b>.","Escolha o equipamento (impressora, leitor de código de barras etc.) e rode o teste.","Se o teste funcionar no utilitário mas não no PDV, a configuração do PDV está apontando para o equipamento errado. Chame o suporte."]},{"h":"Testar o leitor de código de barras"},{"steps":["Abra a pasta \u003cb>C:\\Saurus\\Saurus PDV\u003c/b> e execute o \u003cb>Saurus Framework\u003c/b>.","Escolha \u003cb>Teste de Utilidades\u003c/b>.","Clique em \u003cb>Testar Leitor CodBarras\u003c/b>.","Passe o leitor em qualquer produto. A tela mostra exatamente o que o leitor enviou. Se aparecer vazio ou com números trocados, o problema é no leitor ou no cabo."]},{"h":"Vídeos"},{"videos":[["Recomendações para impressoras (2:03:47)","https://www.youtube.com/watch?v=i83VlUnIWoQ&t=7427s"],["Ferramentas úteis e pouco conhecidas","https://www.youtube.com/watch?v=nFJ-8FqqpRY"]]},{"tip":"Se nem o teste do Saurus Dispositivos imprime, o problema é no Windows ou na impressora. Siga \u003ca href=\"#spooler\">Reiniciar o spooler\u003c/a> e \u003ca href=\"#termica-usb\">Impressora térmica USB\u003c/a>."}]},{"id":"pdvlegal-impressora","cat":"pdvlegal","sis":"pdvlegal","titulo":"Configurar a impressora no PDV Legal","lead":"Serve para impressora de cupom e de produção, ligada por cabo de rede, USB ou Bluetooth.","tags":"pdv legal impressora configurar rede usb bluetooth ip porta testar","corpo":[{"steps":["No PDV, toque em \u003cb>Configurar → Impressoras\u003c/b>.","Escolha a impressora e toque em \u003cb>Editar\u003c/b>.","Em \u003cb>Marca\u003c/b>, escolha o modelo da impressora. Se a marca não estiver na lista, use o modo \u003cb>Gráfico\u003c/b> ou \u003cb>Texto\u003c/b>.","Siga a parte do tipo de ligação da sua impressora, logo abaixo.","Toque em \u003cb>Salvar\u003c/b> e depois em \u003cb>Testar impressora\u003c/b>."]},{"h":"Impressora de rede (cabo)"},{"steps":["Ligue o cabo da impressora numa porta LAN do roteador.","Confirme que o tablet ou PDV está na mesma rede (mesmo Wi-Fi) desse roteador.","Digite o \u003cb>IP da impressora\u003c/b>. A porta é preenchida sozinha ao escolher a marca.","Deixe o status como \u003cb>Ativa\u003c/b>."]},{"tip":"Não sabe o IP? Vá em \u003cb>Configurar → Lista de dispositivos na rede\u003c/b> ou veja \u003ca href=\"#impressora-rede\">como achar o IP da impressora\u003c/a>."},{"h":"Impressora USB"},{"steps":["Ligue o cabo USB no PDV ou tablet.","Em \u003cb>Interface\u003c/b>, escolha \u003cb>USB\u003c/b>.","Se o teste não imprimir, troque o número da \u003cb>Porta\u003c/b> entre 0, 1 e 2 e teste de novo."]},{"h":"Impressora Bluetooth"},{"steps":["Nas configurações de Bluetooth do Android, pareie a impressora. A senha costuma ser \u003cb>1234\u003c/b> ou \u003cb>0000\u003c/b>.","Em \u003cb>Interface\u003c/b>, escolha \u003cb>Bluetooth\u003c/b>.","Digite o nome da impressora \u003cb>exatamente\u003c/b> como aparece no Bluetooth e a senha do pareamento."]},{"h":"Vídeo: impressora de vale"},{"videos":[["Configurar impressora de vale","https://www.youtube.com/watch?v=htN9a1bjo-w"]]},{"h":"Ajustes que também ficam nessa tela"},{"p":"Largura do papel (58 mm ou 80 mm), corte automático (se a impressora tiver guilhotina), abertura da gaveta e margens. Se o cupom sai cortado ou torto, confira primeiro a largura do papel."}]},{"id":"pdvlegal-producao","cat":"pdvlegal","sis":"pdvlegal","titulo":"Pedido não imprime na cozinha (PDV Legal)","lead":"O PDV Legal manda cada item para a impressora indicada no cadastro do produto. Se o nome não bate, o pedido não sai.","tags":"pdv legal produção cozinha bar pedido não imprime nome impressora","corpo":[{"steps":["Confira se a impressora da cozinha está ligada, com papel e com cabo de rede.","No Retaguarda Cloud, abra o cadastro do produto e veja em \u003cb>Configurações\u003c/b> para qual impressora ele vai (ex.: \u003cb>Impressora Cozinha\u003c/b>).","No PDV, em \u003cb>Configurar → Impressoras\u003c/b>, a impressora da cozinha precisa ter \u003cb>o mesmo nome\u003c/b> usado no cadastro do produto.","Se mudou algo no Retaguarda, faça a sincronização no PDV em \u003cb>+Funções → Sincronizar tabelas\u003c/b>.","Faça um teste em \u003cb>Configurar → Impressoras → Testar impressora\u003c/b>."]},{"tip":"Quer que a cozinha receba um aviso quando um item for cancelado? No PDV, em \u003cb>Configurações → Parâmetros do Sistema\u003c/b>, ative \u003cb>Imprimir Canc. Produção\u003c/b>."}]},{"id":"pdvlegal-reimprimir","cat":"pdvlegal","sis":"pdvlegal","titulo":"Reimprimir um cupom no PDV Legal","lead":"Para quando o cupom saiu falhado, o cliente pediu outra via ou a impressora estava sem papel.","tags":"pdv legal reimprimir segunda via cupom nfce sat reemitir","corpo":[{"steps":["No PDV, abra \u003cb>Vendas\u003c/b> e digite sua senha.","Toque em \u003cb>+Funções\u003c/b> (canto inferior esquerdo) e depois em \u003cb>Painel\u003c/b>.","Use o filtro para achar a venda por data, número ou cliente, e toque nela.","Toque em \u003cb>Ações\u003c/b> (canto superior direito) → \u003cb>Reimprimir NFC-e\u003c/b> (ou \u003cb>Reimprimir S@T\u003c/b>) → \u003cb>Imprimir\u003c/b>."]}]},{"id":"pdvlegal-erro-fiscal","cat":"fiscal","sis":"pdvlegal","titulo":"PDV Legal bloqueou o pagamento: \"Erro com documentos fiscais\"","lead":"Quando a última nota emitida volta com um erro grave da SEFAZ, o PDV Legal avisa e trava o pagamento de novas vendas até corrigir.","tags":"pdv legal erro com documentos fiscais bloqueio pagamento rejeição nota painel","corpo":[{"p":"Enquanto o aviso estiver na tela, você ainda pode lançar itens e suspender vendas. Só o pagamento fica travado."},{"steps":["Abra o \u003cb>Painel de documentos fiscais\u003c/b> no PDV.","Toque na nota com erro e leia a mensagem da SEFAZ. Tire uma foto da tela.","Erro de data ou hora: veja \u003ca href=\"#pdvlegal-fuso\">Rejeição por horário no PDV Legal\u003c/a>.","Erro de certificado: veja \u003ca href=\"#certificado\">Certificado digital\u003c/a>.","Erro de cadastro (CNPJ, IE, CSC, tributação de produto): mande a foto para o suporte. Depois da correção, faça \u003cb>Baixar Tabelas\u003c/b> no PDV.","Quando a última nota estiver sem erro, o pagamento é liberado sozinho."]},{"warn":"Não cancele a nota nem refaça a venda sem falar com o suporte."}]},{"id":"pdvlegal-fuso","cat":"fiscal","sis":"pdvlegal","titulo":"Rejeição por horário no PDV Legal","lead":"Se as notas voltam rejeitadas por data ou hora, o fuso horário do terminal pode estar errado.","tags":"pdv legal fuso horário rejeição hora data nfce terminal","corpo":[{"steps":["Primeiro confira se a data e a hora do aparelho estão certas.","No PDV, vá em \u003cb>Configurações → Parâmetros do sistema\u003c/b>.","Procure a opção de fuso horário da emissão fiscal e escolha o fuso do seu estado (a maior parte do Brasil é \u003cb>-3\u003c/b>). \u003cb>Não mudar\u003c/b> usa o fuso cadastrado da loja.","Faça uma venda de teste e veja se a nota é autorizada."]},{"p":"Essa opção vale só para o aparelho em que foi ajustada e existe a partir da versão 26.06.01.200. Se não aparecer, veja \u003ca href=\"#pdvlegal-atualizar\">como atualizar o PDV Legal\u003c/a>."}]},{"id":"pdvlegal-caixa","cat":"pdvlegal","sis":"pdvlegal","titulo":"Abrir, fazer sangria e fechar o caixa (PDV Legal)","lead":"As três rotinas do dia a dia do operador.","tags":"pdv legal abrir caixa fundo de troco sangria fechar caixa encerramento operador","corpo":[{"videos":[["Abrir e fechar o caixa","https://www.youtube.com/watch?v=mfhlAYak324"],["Encerramento de caixa","https://www.youtube.com/watch?v=fSCUhkQlI-Y"]]},{"h":"Abrir o caixa (fundo de troco)"},{"steps":["No menu principal, toque em \u003cb>Fundo de Caixa\u003c/b>.","Digite a senha do operador.","Digite o valor do troco inicial e toque em \u003cb>Gravar\u003c/b>."]},{"tip":"Acabou o troco no meio do dia? Use o mesmo \u003cb>Fundo de Caixa\u003c/b> para lançar o reforço."},{"h":"Sangria (retirada de dinheiro)"},{"steps":["No menu principal, toque em \u003cb>Sangria\u003c/b>.","Digite a senha, o motivo e o valor.","Toque em \u003cb>Gravar\u003c/b>."]},{"h":"Fechar o caixa"},{"steps":["Toque em \u003cb>Encerrar\u003c/b> e digite a senha.","Toque em \u003cb>Encerramento do Operador\u003c/b>.","Escolha o operador (ou \u003cb>Fechar Todos\u003c/b>).","Digite o valor contado em cada forma de pagamento. Deixe em branco as que não tiveram movimento.","Toque em \u003cb>Continuar\u003c/b>."]}]},{"id":"pdvlegal-atualizar","cat":"pdvlegal","sis":"pdvlegal","titulo":"Atualizar o PDV Legal","lead":"O PDV Legal obriga uma atualização a cada 3 meses e trava o uso até ela ser feita. Melhor atualizar antes, fora do horário de movimento.","tags":"pdv legal atualizar atualização versão backup bloqueado","corpo":[{"h":"1. Faça o backup antes"},{"steps":["Toque em \u003cb>Configurar\u003c/b> → \u003cb>Backup dos Dados\u003c/b> e espere terminar."]},{"h":"2. Atualize"},{"steps":["Toque em \u003cb>Configurar\u003c/b> → os \u003cb>três pontinhos\u003c/b> (canto superior direito) → \u003cb>Atualização\u003c/b>.","Toque em \u003cb>Verificar\u003c/b>.","Se tiver versão nova, toque em \u003cb>Atualizar\u003c/b>, confirme e siga a tela até o fim."]},{"warn":"Não desligue o aparelho durante a atualização. Se o botão de atualizar não funcionar (acontece em versões antigas), chame o suporte para instalar pelo link externo."}]},{"id":"pdvlegal-gaveta","cat":"pdvlegal","sis":"pdvlegal","titulo":"Gaveta de dinheiro não abre (PDV Legal)","lead":"A gaveta abre pela impressora, através de um cabo de telefone (RJ-11). Se um dos três pontos abaixo falhar, ela não abre.","tags":"pdv legal gaveta dinheiro não abre rj11 cabo","corpo":[{"steps":["\u003cb>Cabo:\u003c/b> confira o cabo RJ-11 bem encaixado na gaveta e na impressora (não no computador).","\u003cb>Impressora:\u003c/b> no PDV, em \u003cb>Configurar → Parâmetros do Sistema\u003c/b>, escolha a impressora onde a gaveta está ligada e confira se a opção \u003cb>Gaveta\u003c/b> está ligada.","\u003cb>Forma de pagamento:\u003c/b> no Retaguarda (Gestão Legal), em \u003cb>Administrativo → Formas de Pagamento PDV\u003c/b>, a forma usada (ex.: Dinheiro) precisa estar com \u003cb>Abre gaveta = SIM\u003c/b>."]},{"tip":"Se a impressora não imprime, a gaveta também não abre. Resolva a impressora primeiro."}]},{"id":"pdvlegal-servidor","cat":"rede","sis":"pdvlegal","titulo":"PDV Legal: \"Erro de conexão\" com o servidor local","lead":"Para lojas que usam um servidor local (a caixinha Raspberry) ligado ao roteador para unir os terminais.","tags":"pdv legal raspberry servidor local erro de conexão compartilhador roteador","corpo":[{"steps":["Confira se a caixinha do servidor está com a luz acesa e com o cabo de rede firme nela e no roteador.","Tire da tomada e ligue de novo (servidor e roteador). Espere 2 minutos.","No PDV, vá em \u003cb>Configurar → Parâmetros do Sistema → Rede\u003c/b> e toque em \u003cb>Testar compartilhador\u003c/b>. Se aparecer \u003cb>Conexão OK\u003c/b>, voltou."]},{"warn":"Trocou de roteador ou de provedor de internet recentemente? Essa é a causa mais comum: a rede nova usa outra faixa de IP. Chame o suporte para ajustar."}]},{"id":"pdvlegal-sinc","cat":"pdvlegal","sis":"pdvlegal","titulo":"Vendas não sincronizadas no PDV Legal","lead":"Quando as vendas do caixa não aparecem no Retaguarda Cloud, elas podem estar presas no aparelho.","tags":"pdv legal sincronizar vendas não aparecem retaguarda cloud status sincronização","corpo":[{"steps":["Confira se o aparelho está com internet.","No PDV, abra \u003cb>Relatórios → Status Sincronização Web\u003c/b>.","Toque no ícone de \u003cb>funil\u003c/b> (canto superior direito) e escolha o período (hoje, ontem ou outro).","Toque em \u003cb>Sinc\u003c/b> para enviar as vendas pendentes."]},{"warn":"Se o aviso continuar, chame o suporte. Não apague dados nem remova a licença por conta própria: vendas não enviadas podem ser perdidas."}]},{"id":"pallas-impressora-windows","cat":"pallas","sis":"pallas","titulo":"Configurar impressora no Pallas (Windows)","lead":"Para o caixa no computador: cupom, conferência e produção são configurados no Retaguarda.","tags":"pallas impressora retaguarda f12 endereço colunas modelo teste 48 64 32","corpo":[{"p":"A impressora precisa estar instalada no Windows antes. Se ela não imprime nem a página de teste do Windows, veja \u003ca href=\"#termica-usb\">Impressora térmica USB\u003c/a>."},{"steps":["Abra o \u003cb>Retaguarda\u003c/b> e aperte \u003ckbd>F12\u003c/kbd> (Parâmetros).","Vá em \u003cb>Impressoras\u003c/b> → \u003cb>Nova impressora\u003c/b> (ou abra a que já existe).","\u003cb>Nome:\u003c/b> um nome fácil, como \u003ci>Caixa\u003c/i> ou \u003ci>Cozinha\u003c/i>.","\u003cb>Modelo:\u003c/b> a marca da impressora.","\u003cb>Endereço:\u003c/b> o nome da impressora \u003cb>exatamente\u003c/b> como aparece no Windows (veja abaixo como achar).","\u003cb>Colunas:\u003c/b> use a tabela abaixo conforme a largura da bobina.","Clique em \u003cb>imprimir página de teste + status\u003c/b>. Se o status vier \u003cb>OK\u003c/b> e sair o cupom de teste, está pronto."]},{"h":"Como achar o nome da impressora no Windows"},{"steps":["Aperte a tecla \u003ckbd>Win\u003c/kbd> e digite \u003cb>impressoras e scanners\u003c/b>.","Na lista, ache a impressora térmica e copie o nome dela letra por letra, com espaços e números."]},{"h":"Colunas por largura de papel"},{"table":[["Bobina","Normal","Condensada"],["80 mm","48","64"],["58 mm","32","48"]]},{"tip":"Cupom desalinhado mesmo com esses números? Imprima a página de teste, conte quantos caracteres cabem na linha normal e na condensada e coloque esses valores. Teste de novo."}]},{"id":"pallas-impressora-mobile","cat":"pallas","sis":"pallas","titulo":"Impressora no Pallas PDV Mobile e maquininha","lead":"No celular, tablet, Elgin M10 ou maquininha Stone, a impressora é cadastrada na Nuvem e depois escolhida no aplicativo.","tags":"pallas pdv mobile nuvem impressora rede bluetooth maquininha stone m10 embarcada","corpo":[{"h":"1. Cadastrar na Nuvem"},{"steps":["Entre na Nuvem do Pallas (\u003cb>app.sistemapallas.com.br\u003c/b>).","Vá em \u003cb>Cadastros → Impressoras\u003c/b> e clique em \u003cb>+Novo\u003c/b>.","Dê um nome, escolha o modelo e, se for de rede, digite o IP (veja \u003ca href=\"#impressora-rede\">como achar o IP\u003c/a>).","Para imprimir na própria maquininha, use o tipo \u003cb>Embarcada\u003c/b>."]},{"h":"2. Escolher no aplicativo"},{"steps":["No app Pallas PDV, selecione a impressora que você cadastrou na Nuvem.","Se for \u003cb>Bluetooth\u003c/b>: primeiro pareie a impressora nas configurações de Bluetooth do aparelho. Depois, no app, toque em \u003cb>Selecione o dispositivo bluetooth\u003c/b>, escolha a impressora e toque em \u003cb>Testar\u003c/b>."]}]},{"id":"pallas-fechamento","cat":"pallas","sis":"pallas","titulo":"Fechar o caixa no Pallas (Windows)","lead":"Fechamento do turno no PDV Windows, com contagem de cédulas e formas de pagamento.","tags":"pallas fechar caixa fechamento turno cédulas troco","corpo":[{"steps":["Na tela inicial do PDV, clique em \u003cb>Fechar Caixa\u003c/b>.","Confira no topo a data de abertura, quem abriu e o troco inicial.","Digite o valor que vai \u003cb>ficar no caixa\u003c/b> como troco para o próximo turno.","Na tabela de \u003cb>cédulas e moedas\u003c/b>, digite a quantidade de cada nota e moeda.","Na tabela das \u003cb>formas de pagamento\u003c/b> (dinheiro, débito, crédito, Pix), confira ou digite os totais.","Clique em \u003cb>Confirma o Fechamento do Caixa\u003c/b>."]},{"p":"Os relatórios do fechamento ficam disponíveis no Retaguarda. Se der erro ao fechar, tire um print e chame o suporte."}]},{"id":"pallas-sangria","cat":"pallas","sis":"pallas","titulo":"Fazer sangria no Pallas (Windows)","lead":"Retirada de dinheiro do caixa durante o dia. A sangria aparece depois no fechamento.","tags":"pallas sangria retirada dinheiro privilégio funcionário movimentos","corpo":[{"steps":["Abra uma \u003cb>comanda vazia\u003c/b>.","Clique em \u003cb>Movimentos → Sangria\u003c/b>.","Digite o valor e clique em \u003cb>OK\u003c/b>."]},{"p":"No fechamento, o total das sangrias é descontado do dinheiro e cada uma aparece listada com hora e valor."},{"tip":"A opção não aparece? O funcionário precisa ter permissão. No Retaguarda: \u003cb>Parceiros → Funcionários\u003c/b> → abra o funcionário → \u003cb>Funcionário → Privilégios\u003c/b> → marque \u003cb>Sangria\u003c/b> e grave."}]},{"id":"pallas-cancelar-pagamento","cat":"pallas","sis":"pallas","titulo":"Cancelar um pagamento lançado errado (Pallas)","lead":"O cliente quer trocar a forma de pagamento depois que você já confirmou? Dá para desfazer.","tags":"pallas cancelar pagamento trocar forma de pagamento delete estorno","corpo":[{"steps":["Na tela que mostra o pagamento já lançado, aperte a tecla \u003ckbd>Delete\u003c/kbd>.","Clique em \u003cb>SIM\u003c/b> para confirmar.","Escolha a forma de pagamento certa."]},{"warn":"Se o pagamento foi no cartão, o estorno na maquininha e a devolução ao cliente são feitos à parte, manualmente."},{"tip":"Se a tecla não fizer nada, o funcionário precisa do privilégio \u003cb>Cancelar Compra\u003c/b> (Retaguarda → Parceiros → Funcionários → Privilégios). Peça ao suporte para ativar o recurso se ainda não estiver ligado."}]},{"id":"pallas-cpf","cat":"pallas","sis":"pallas","titulo":"CPF na nota no Pallas","lead":"Como colocar o CPF do cliente na NFC-e.","tags":"pallas cpf na nota cliente nfce","corpo":[{"steps":["No fechamento da venda, preencha o campo \u003cb>CPF\u003c/b>.","Digite \u003cb>só os números\u003c/b>, sem ponto e sem traço.","Emita a nota normalmente."]},{"warn":"Depois que a nota é emitida, não dá para incluir o CPF. Pergunte antes de finalizar."}]},{"id":"pallas-servidor","cat":"pallas","sis":"pallas","titulo":"Caixas não abrem: servidor Pallas","lead":"Em lojas com mais de um computador, os caixas não têm banco de dados próprio. Eles dependem do computador servidor.","tags":"pallas servidor terminal não abre pallas serviço banco de dados","corpo":[{"steps":["Confira se o computador \u003cb>servidor\u003c/b> está ligado e logado no Windows.","No servidor, confira se o serviço do Pallas está rodando: aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite \u003ccode>services.msc\u003c/code>, procure o serviço do \u003cb>Pallas\u003c/b> e veja se está \u003cb>Em execução\u003c/b>. Se estiver parado, clique com o botão direito → \u003cb>Iniciar\u003c/b>.","Depois abra o Pallas de novo nos caixas.","Se continuar, teste a rede entre o caixa e o servidor (veja \u003ca href=\"#servidor\">Caixa não conecta no servidor\u003c/a>)."]},{"cmd":"services.msc"},{"warn":"Não desligue o servidor no meio do expediente: todos os caixas param junto."}]},{"id":"pallas-offline","cat":"pallas","sis":"pallas","titulo":"Pallas funciona sem internet?","lead":"O PDV Windows continua vendendo sem internet, mas algumas funções param até a conexão voltar.","tags":"pallas offline sem internet vendas abertas nuvem ifood","corpo":[{"p":"Sem internet, as vendas no caixa continuam. Param o que depende de fora: atualização da Nuvem, iFood e pedidos on-line, Pix e pagamentos on-line. As NFC-e vão para contingência e precisam ser enviadas depois (veja \u003ca href=\"#contingencia-pallas\">Enviar notas em contingência no Pallas\u003c/a>)."},{"tip":"Quem tem a \u003cb>Nuvem\u003c/b> ativa tem também as \u003cb>Vendas Abertas\u003c/b>: as comandas abertas ficam salvas na nuvem. Se faltar luz ou o computador queimar, dá para consultar o que estava aberto."}]},{"id":"pallas-rejeicoes","cat":"fiscal","sis":"pallas","titulo":"Rejeições de NFC-e mais comuns no Pallas","lead":"O que significam os códigos que mais aparecem e o que fazer em cada um.","tags":"pallas rejeição 225 297 464 778 ncm csc ie caractere especial nome remoto ssl tls","corpo":[{"table":[["Código / mensagem","O que é","O que fazer"],["225","Inscrição Estadual (ou nome de produto) com espaço sobrando ou caractere especial","Corrija o cadastro e reenvie"],["297","Produto com caractere que a SEFAZ não aceita: ¹ ² ³ % &amp; &lt; &gt; ª º ´ ? * ou quebra de linha","Ache o produto, apague o caractere e reenvie"],["464","Código CSC do sistema diferente do cadastrado na SEFAZ","Peça o CSC e o ID ao contador e digite em F12 sem espaços"],["778","NCM do produto não existe mais","Atualize o NCM do produto (o contador informa o certo)"],["O nome remoto não pode ser resolvido","Problema de DNS na internet da loja","Reinicie o modem e rode ipconfig /flushdns"],["SSL/TLS","Windows desatualizado ou cadeia do certificado faltando","Atualize o Windows e chame o suporte"]]},{"h":"Limpar o DNS (\"nome remoto não pode ser resolvido\")"},{"cmd":"ipconfig /flushdns"},{"warn":"Para 225, 297 e 778 a correção é no cadastro do produto ou da empresa. Se não souber qual produto está com problema, mande o print da rejeição para o suporte."}]},{"id":"pallas-acesso-negado","cat":"pallas","sis":"pallas","titulo":"Erro: \"O acesso ao caminho C:\\ProgramData\\Pallas\\NFCe foi negado\"","lead":"O Windows está bloqueando a pasta onde o Pallas guarda as notas. A NFC-e fica pendente até resolver.","tags":"pallas acesso negado programdata nfce permissão pasta pendente","corpo":[{"h":"Solução 1 (tente primeiro)"},{"steps":["Feche o PDV.","Clique com o botão direito no atalho do \u003cb>PDV Windows\u003c/b> → \u003cb>Executar como administrador\u003c/b> → \u003cb>Sim\u003c/b>.","Reenvie as notas pendentes."]},{"h":"Solução 2: liberar a pasta"},{"steps":["Abra o Explorador de Arquivos e entre em \u003cb>Disco Local (C:)\u003c/b>.","Em \u003cb>Exibir\u003c/b>, marque \u003cb>Itens ocultos\u003c/b> para a pasta \u003cb>ProgramData\u003c/b> aparecer.","Botão direito em \u003cb>ProgramData\u003c/b> → \u003cb>Propriedades\u003c/b> → aba \u003cb>Segurança\u003c/b> → \u003cb>Editar\u003c/b>.","Para cada usuário da lista, marque \u003cb>Permitir\u003c/b> em Modificar, Ler e Executar, Listar conteúdo, Leitura e Gravação.","Clique em \u003cb>Aplicar\u003c/b> e \u003cb>OK\u003c/b>, abra o PDV como administrador e reenvie as notas."]},{"tip":"Se não se sentir seguro para mexer em permissões, chame o suporte: resolvemos por acesso remoto."}]},{"id":"pallas-equipamento","cat":"pallas","sis":"pallas","titulo":"Pallas PDV Mobile: \"Equipamento desativado\"","lead":"O aparelho (celular, tablet ou maquininha) foi desativado na Nuvem e o app para de funcionar.","tags":"pallas equipamento desativado pdv mobile nuvem ativar falha do certificado","corpo":[{"steps":["Entre na Nuvem do Pallas.","Vá em \u003cb>Perfil do usuário → Equipamentos\u003c/b>.","Ache a linha com o mesmo \u003cb>ID do equipamento\u003c/b> que aparece na mensagem de erro.","Clique em \u003cb>EDITAR\u003c/b>, marque \u003cb>Ativo\u003c/b> e salve.","Volte ao app e tente de novo."]},{"tip":"A mensagem é \u003cb>Falha do certificado, tente novamente em alguns minutos\u003c/b>? O aparelho não conseguiu falar com a Nuvem. Confira a internet, espere alguns minutos e tente de novo."}]},{"id":"pallas-senha","cat":"pallas","sis":"pallas","titulo":"Esqueci a senha da Nuvem do Pallas","lead":"Como criar uma senha nova para entrar no Pallas Nuvem.","tags":"pallas senha esqueci recuperar nuvem login","corpo":[{"steps":["Abra \u003cb>app.sistemapallas.com.br\u003c/b>.","Clique em \u003cb>Esqueci minha senha\u003c/b>.","Digite seu e-mail e clique em \u003cb>Redefinir Senha\u003c/b>.","Abra o e-mail do Sistema Pallas (olhe também o spam) e clique em \u003cb>Gerar nova senha\u003c/b>.","Crie a senha nova e entre com seu usuário."]},{"cmd":"https://app.sistemapallas.com.br/"}]},{"id":"pallas-tef-registro","cat":"pallas","sis":"pallas","titulo":"TEF no Pallas: \"Realize o registro do terminal\"","lead":"O pinpad não está registrado no SiTEF, então o cartão não passa pelo TEF.","tags":"pallas tef sitef pinpad registro do terminal cartão erro","corpo":[{"steps":["Confira se a mensagem na tela é \u003cb>Realize o registro do terminal\u003c/b>.","Enquanto isso, passe o cartão numa maquininha avulsa para não parar o caixa.","Chame o suporte com o número de série do pinpad e o CNPJ da loja. O registro é liberado junto ao SiTEF."]}]},{"id":"saurus-atalhos","cat":"saurus","sis":"saurus","titulo":"Teclas de atalho do Saurus PDV","lead":"Os atalhos que mais usamos no caixa. Imprima e deixe perto do teclado.","tags":"saurus teclas atalho f1 f2 f7 f8 sangria suprimento gaveta reimprimir cancelar","corpo":[{"h":"Teclas F"},{"table":[["Tecla","O que faz"],["F1","Finaliza a venda (cupom fiscal)"],["F2","Finaliza em contingência (sem internet)"],["F3","Pesquisa de produto"],["F4","Informa a quantidade do próximo produto"],["F5","Consulta preço sem lançar"],["F6","Escolhe o cliente"],["F7","Imprime o resumo do caixa (leitura X)"],["F8","Cancela um cupom"],["F9","Importa pré-venda / pedido on-line"],["F11","Ajuda"],["F12","Volta para a tela anterior"]]},{"h":"Letras mais usadas"},{"table":[["Tecla","O que faz"],["C","Tela de contingência da NFC-e (enviar notas pendentes)"],["D","Desconto no item ou no cupom (% ou R$)"],["A","Acréscimo no item ou no cupom"],["E","Suprimento (colocar dinheiro no caixa)"],["S","Sangria (tirar dinheiro do caixa)"],["G","Abre a gaveta"],["I","Reimprime um cupom"],["R","Reabre uma venda finalizada"],["X","Mostra o pagamento da última venda"],["Z","Mostra as comandas abertas"],["V","Escolhe o vendedor"],["W","Emite vale-troca"],["H","Calculadora"]]},{"h":"Outras"},{"table":[["Tecla","O que faz"],["Delete","Apaga o item selecionado"],["Shift","Funções do terminal (comandas)"],["Ctrl","Liga/desliga código alfanumérico"]]},{"h":"Vídeo: o Saurus PDV no dia a dia"},{"videos":[["Funcionalidades e uso do dia a dia no Saurus PDV","https://www.youtube.com/watch?v=g0NgrMOTCPo"]]}]},{"id":"saurus-forcar","cat":"fiscal","sis":"saurus","titulo":"Notas rejeitadas no Saurus: forçar autorização","lead":"Quando as notas ficam rejeitadas por duplicidade ou presas na contingência, o Saurus pode ser aberto de um jeito especial que consulta a SEFAZ e autoriza o que já foi aceito.","tags":"saurus rejeição duplicidade forcarautorizacao forçar autorização contingência atalho","corpo":[{"steps":["Feche o Saurus PDV.","Clique com o botão direito no atalho do Saurus PDV na área de trabalho → \u003cb>Copiar\u003c/b>, e depois botão direito na área de trabalho → \u003cb>Colar\u003c/b>. Assim você mexe numa cópia e mantém o atalho original.","Botão direito na cópia → \u003cb>Propriedades\u003c/b>.","No campo \u003cb>Destino\u003c/b>, vá até o final, \u003cb>depois\u003c/b> das aspas, dê um espaço e digite o texto abaixo:"]},{"cmd":"forcarautorizacao=true"},{"p":"O campo fica parecido com isto (o caminho do seu computador pode ser outro):"},{"cmd":"\"C:\\Saurus\\Saurus PDV\\SaurusPDV.exe\" forcarautorizacao=true"},{"steps":["Clique em \u003cb>OK\u003c/b>.","Abra o Saurus por esse atalho novo.","Aperte \u003ckbd>C\u003c/kbd> para abrir a tela de contingência, selecione as notas e clique em \u003cb>Transmitir Selecionadas\u003c/b>.","Depois, volte a usar o atalho normal no dia a dia."]},{"warn":"Isso só resolve duplicidade e notas presas. Se a rejeição for de cadastro (NCM, imposto, CSC), é preciso corrigir o cadastro primeiro. Mande o print para o suporte."}]},{"id":"saurus-caixa","cat":"saurus","sis":"saurus","titulo":"Sangria, suprimento e fechamento no Saurus","lead":"Como lançar entradas e saídas de dinheiro e entender o cupom de fechamento.","tags":"saurus sangria suprimento fechamento sessão leitura x falta sobra diferença despesa receita","corpo":[{"table":[["Tecla","Para que serve"],["E","Suprimento: colocar troco no caixa"],["S","Sangria: tirar dinheiro do caixa"],["J","Despesa: pagou algo com o dinheiro do caixa"],["Q","Receita: entrou dinheiro que não é venda"],["F7","Leitura X: resumo do caixa até agora"]]},{"h":"Entendendo o cupom de fechamento"},{"steps":["\u003cb>Em Caixa:\u003c/b> quanto o sistema calculou que deveria ter (abertura + vendas + suprimentos − sangrias − despesas).","\u003cb>Fechado:\u003c/b> quanto o operador contou e digitou em cada forma de pagamento.","\u003cb>Diferença:\u003c/b> se for positiva, faltou dinheiro; se for negativa, sobrou."]},{"tip":"Despesas e receitas lançadas no PDV ficam só no fechamento do caixa. Elas não vão para o financeiro do Saurus V4."}]},{"id":"saurus-cozinha","cat":"saurus","sis":"saurus","titulo":"Pedido não imprime na cozinha (Saurus)","lead":"No Saurus, cada produto tem um caminho de impressão. Se a impressora mudou de nome ou o compartilhamento caiu, o pedido não sai.","tags":"saurus cozinha setor produção impressão compartilhada acesso negado credenciais","corpo":[{"steps":["Confira se a impressora da cozinha está ligada e com papel.","Reinicie o spooler no computador onde a impressora está ligada (\u003ca href=\"#spooler\">veja como\u003c/a>).","Confira se a impressora continua \u003cb>compartilhada\u003c/b> no Windows e com o mesmo nome de antes (ex.: \u003cb>COZINHA\u003c/b>).","Faça o teste abaixo no computador que manda o pedido."]},{"h":"Vídeo"},{"videos":[["Impressora de setor / cozinha (2:54:49)","https://www.youtube.com/watch?v=i83VlUnIWoQ&t=10489s"]]},{"h":"Testar a impressora compartilhada"},{"p":"Abra o Prompt de Comando \u003ca href=\"#cmd-admin\">como administrador\u003c/a> e digite (troque \u003cb>servidor\u003c/b> pelo nome do computador e \u003cb>COZINHA\u003c/b> pelo nome do compartilhamento):"},{"cmd":"DIR > \\\\servidor\\COZINHA"},{"steps":["Se imprimir uma lista de arquivos: a comunicação está ok. O problema está na configuração do produto; chame o suporte.","Se aparecer \u003cb>Acesso negado\u003c/b>: abra o \u003cb>Gerenciador de Credenciais\u003c/b> do Windows → \u003cb>Credenciais do Windows\u003c/b> → \u003cb>Adicionar\u003c/b>. Digite o nome do outro computador (sem as barras), um usuário e a senha dele.","Faça isso nos dois computadores: no que manda e no que tem a impressora."]}]},{"id":"usb-energia","cat":"windows","sis":"geral","titulo":"Impressora, SAT ou leitor USB desconectando sozinho","lead":"O Windows desliga portas USB para economizar energia e o equipamento \"some\" no meio do dia. Estes ajustes resolvem.","tags":"usb desconecta some economia energia root hub suspensão seletiva sat impressora leitor","corpo":[{"h":"1. Desligar a economia de energia das portas USB"},{"steps":["Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite o comando abaixo e aperte \u003ckbd>Enter\u003c/kbd>:"]},{"cmd":"devmgmt.msc"},{"steps":["Abra \u003cb>Controladores USB (barramento serial universal)\u003c/b>.","Dê dois cliques em \u003cb>Hub raiz USB\u003c/b> (pode ter vários).","Na aba \u003cb>Gerenciamento de energia\u003c/b>, desmarque \u003cb>O computador pode desligar o dispositivo para economizar energia\u003c/b>.","Clique em \u003cb>OK\u003c/b> e repita em todos os \u003cb>Hub raiz USB\u003c/b> da lista."]},{"h":"2. Desligar a suspensão seletiva de USB"},{"steps":["Abra o \u003cb>Painel de Controle → Opções de Energia\u003c/b>.","No plano em uso, clique em \u003cb>Alterar configurações do plano → Alterar configurações de energia avançadas\u003c/b>.","Abra \u003cb>Configurações de USB → Configuração de suspensão seletiva de USB\u003c/b> e marque \u003cb>Desabilitado\u003c/b> (em notebook, nas duas opções: bateria e tomada).","Clique em \u003cb>OK\u003c/b>."]},{"tip":"Evite ligar muita coisa num hub USB sem fonte. Leitor, teclado e mouse podem ir no hub; impressora e SAT, direto no computador."}]},{"id":"sat-porta","cat":"fiscal","sis":"geral","titulo":"SAT: \"Erro na porta de comunicação\"","lead":"Quase sempre é oscilação de energia: o SAT trava por dentro, mesmo com as luzes acesas.","tags":"sat erro porta comunicação rb1000 bematech luzes reiniciar","corpo":[{"steps":["Desligue o SAT e tire o cabo de energia. Tire também o cabo USB e confira se todas as luzes apagaram.","Confira o cabo USB em \"Y\": as duas pontas precisam estar ligadas no computador (a ponta mais grossa, de dados, direto no computador).","Ligue o cabo USB de novo e depois a energia.","Espere as luzes piscarem. Está pronto quando as luzes verdes \u003cb>PAR\u003c/b>, \u003cb>OP/AC\u003c/b>, \u003cb>LAN\u003c/b> e \u003cb>LIG\u003c/b> ficarem acesas (a vermelha \u003cb>CFE\u003c/b> acesa não é problema).","Abra o sistema e teste uma venda."]},{"tip":"Se acontece toda semana, ligue o computador e o SAT num nobreak ou estabilizador e faça os ajustes de \u003ca href=\"#usb-energia\">economia de energia USB\u003c/a>."}]},{"id":"saurus-moeda","cat":"windows","sis":"saurus","titulo":"Valores com vírgula ou ponto trocados no Saurus","lead":"Preço aparecendo 1.000 vezes maior ou com ponto no lugar da vírgula? O formato de número do Windows está errado.","tags":"saurus vírgula ponto moeda formato número configurações regionais preço errado","corpo":[{"steps":["Na busca do Windows, digite \u003cb>moeda\u003c/b> e abra \u003cb>Alterar formatos de data, hora ou número\u003c/b>.","Confira se o formato é \u003cb>Português (Brasil)\u003c/b>.","Clique em \u003cb>Configurações adicionais\u003c/b>.","Aba \u003cb>Números\u003c/b>: símbolo decimal \u003cb>,\u003c/b> (vírgula) e agrupamento de dígitos \u003cb>.\u003c/b> (ponto).","Aba \u003cb>Moeda\u003c/b>: símbolo \u003cb>R$\u003c/b>, decimal \u003cb>,\u003c/b> e agrupamento \u003cb>.\u003c/b>","Clique em \u003cb>Aplicar\u003c/b> e \u003cb>OK\u003c/b>, feche e abra o Saurus de novo."]}]},{"id":"cadastrar-produto","cat":"produtos","sis":"geral","titulo":"Como cadastrar um produto (todos os sistemas)","lead":"Passo a passo do cadastro de produto em cada sistema. Escolha o seu abaixo.","tags":"cadastrar produto cadastro novo produto preço código de barras pdv legal pallas saurus mentora","corpo":[{"h":"Tenha em mãos"},{"steps":["Nome do produto e preço de venda.","Código de barras (se tiver).","\u003cb>NCM\u003c/b> e, se tiver, \u003cb>CEST\u003c/b>: estão na nota fiscal do fornecedor, na linha do produto.","A tributação (imposto) que o seu contador passou."]},{"h":"Agora, no seu sistema"},{"tabs":[["PDV Legal","pdvlegal"],["Pallas","pallas"],["Saurus","saurus"],["Mentora","mentora"]],"src":"prod"},{"warn":"Produto com NCM errado ou sem tributação gera nota rejeitada. Na dúvida, confirme com o contador antes de vender."}]},{"id":"ajustar-ncm","cat":"produtos","sis":"geral","titulo":"Como ajustar o NCM de um produto","lead":"A nota voltou com rejeição de NCM (como a 778, NCM inexistente) ou o contador pediu para corrigir? Veja como trocar em cada sistema.","tags":"ncm ajustar corrigir trocar rejeição 778 cest ncm inexistente produto","corpo":[{"h":"Como descobrir o NCM certo"},{"steps":["Olhe a \u003cb>nota fiscal de compra\u003c/b> do fornecedor: o NCM está na linha do produto. É o jeito mais seguro.","Pergunte ao seu \u003cb>contador\u003c/b>.","Para consultar pelo código de barras, use o site \u003cb>cosmos.bluesoft.com.br\u003c/b>."]},{"p":"O NCM tem sempre \u003cb>8 números\u003c/b>, sem pontos (ex.: \u003ccode>22021000\u003c/code> para refrigerante)."},{"h":"Agora, no seu sistema"},{"tabs":[["PDV Legal","pdvlegal"],["Pallas","pallas"],["Saurus","saurus"],["Mentora","mentora"]],"src":"ncm"},{"tip":"Depois de corrigir, reenvie a nota que tinha voltado rejeitada. Veja \u003ca href=\"#subir-contingencia\">Como subir as notas\u003c/a>."}]},{"id":"certificado-sistema","cat":"fiscal","sis":"geral","titulo":"Como colocar o certificado digital no sistema","lead":"Certificado novo ou renovado: como instalar em cada sistema para voltar a emitir nota.","tags":"certificado digital instalar colocar renovar a1 pfx senha csc pdv legal pallas saurus mentora","corpo":[{"h":"Tenha em mãos"},{"steps":["O arquivo do certificado \u003cb>A1\u003c/b> (termina em \u003cb>.pfx\u003c/b> ou \u003cb>.p12\u003c/b>).","A \u003cb>senha\u003c/b> do certificado (quem emitiu o certificado entrega).","O \u003cb>CSC\u003c/b> e o \u003cb>ID do CSC\u003c/b> da NFC-e (o contador informa)."]},{"p":"O CSC sai do \u003cb>credenciamento da NFC-e\u003c/b> no site da SEFAZ do estado. Este vídeo mostra como fazer:"},{"videos":[["Credenciamento da NFC-e (cupom fiscal)","https://www.youtube.com/watch?v=fznowOJ_Q90"]]},{"warn":"O certificado precisa ser do \u003cb>CNPJ\u003c/b> da loja. Certificado no CPF do dono não emite NFC-e."},{"h":"Agora, no seu sistema"},{"tabs":[["PDV Legal","pdvlegal"],["Pallas","pallas"],["Saurus","saurus"],["Mentora","mentora"]],"src":"cert"},{"tip":"Certificado \u003cb>A3\u003c/b> (cartão ou token USB) funciona diferente: precisa ficar ligado no computador e ter o programa do fabricante instalado. Chame o suporte para configurar."}]},{"id":"cert-windows","cat":"fiscal","sis":"geral","titulo":"Instalar certificado A1 no Windows","lead":"Necessário no Pallas Caixa e no Saurus, que leem o certificado direto do Windows.","tags":"certificado a1 instalar windows pfx número de série certmgr exportável","corpo":[{"steps":["Dê dois cliques no arquivo \u003cb>.pfx\u003c/b> do certificado.","Escolha \u003cb>Usuário Atual\u003c/b> e clique em \u003cb>Avançar\u003c/b> duas vezes.","Digite a \u003cb>senha\u003c/b> do certificado.","Marque \u003cb>Marcar esta chave como exportável\u003c/b> e \u003cb>Incluir todas as propriedades estendidas\u003c/b>. Clique em \u003cb>Avançar\u003c/b>.","Escolha \u003cb>Selecionar automaticamente o repositório de certificados\u003c/b> e clique em \u003cb>Avançar\u003c/b>.","Clique em \u003cb>Concluir\u003c/b>. Deve aparecer \u003cb>A importação obteve êxito\u003c/b>."]},{"h":"Conferir e pegar o número de série"},{"p":"Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite o comando abaixo e dê \u003ckbd>Enter\u003c/kbd>:"},{"cmd":"certmgr.msc"},{"steps":["Abra \u003cb>Pessoal → Certificados\u003c/b>. O certificado da loja aparece com o nome da empresa e o CNPJ.","Confira a coluna \u003cb>Data de Validade\u003c/b>.","Para o número de série: dê dois cliques no certificado → aba \u003cb>Detalhes\u003c/b> → clique em \u003cb>Número de série\u003c/b> e copie o código que aparece embaixo."]},{"tip":"Se o sistema roda com outro usuário do Windows, instale o certificado também com esse usuário."},{"h":"Ainda não baixou o arquivo do certificado?"},{"p":"Cada certificadora tem o seu jeito de baixar. Estes vídeos mostram as mais comuns:"},{"videos":[["Baixar e instalar certificado Certisign","https://www.youtube.com/watch?v=QiBJuH90nC0"],["Baixar certificado digital da Syngular","https://www.youtube.com/watch?v=lN1JYnbskQA"],["Baixar certificado digital Soluti","https://www.youtube.com/watch?v=VbBu2OuCkeg"],["Testar certificado digital A3","https://www.youtube.com/watch?v=Sir0qcEkp2c"]]}]},{"id":"pallas-produto-retaguarda","cat":"produtos","sis":"pallas","titulo":"Cadastrar produto no Retaguarda Windows (Pallas)","lead":"Para lojas que usam o Pallas Caixa no computador. Todo cadastro é feito no Retaguarda, e o caixa lê os produtos de lá.","tags":"pallas retaguarda windows cadastrar produto produtos específicos estoque grade ncm impressora produção planilha importar","corpo":[{"h":"Tenha em mãos"},{"steps":["Nome do produto e preço de venda.","Código de barras (se tiver).","\u003cb>NCM\u003c/b> e \u003cb>CEST\u003c/b> (na nota do fornecedor) e o imposto que o contador passou."]},{"h":"1. Cadastrar o produto"},{"steps":["Abra o \u003cb>Retaguarda\u003c/b>.","No menu, vá em \u003cb>Produtos → Produtos Específicos\u003c/b>.","Inclua um produto novo.","Preencha a \u003cb>descrição\u003c/b> (o nome que sai no cupom), o \u003cb>grupo\u003c/b>, a \u003cb>unidade\u003c/b> (UN, KG etc.) e o \u003cb>preço de venda\u003c/b>.","Digite o \u003cb>código de barras\u003c/b>, se tiver.","Preencha o \u003cb>NCM\u003c/b> (8 números, sem pontos), o \u003cb>CEST\u003c/b> (se tiver) e a tributação.","Se o produto vai para a cozinha, bar ou copa, escolha a \u003cb>impressora de produção\u003c/b>.","Clique em \u003cb>Gravar\u003c/b>."]},{"h":"2. Colocar o estoque (opcional)"},{"steps":["Com o produto aberto, vá na aba \u003cb>Estoque\u003c/b>.","Digite a quantidade a somar (ou a tirar) e, se quiser, o motivo.","Clique em \u003cb>Alterar\u003c/b> e confirme com \u003cb>SIM\u003c/b>."]},{"tip":"Quer impedir que o caixa venda produto sem estoque? Aperte \u003ckbd>F12\u003c/kbd> no Retaguarda, vá em \u003cb>PDV → Geral\u003c/b>, marque \u003cb>Bloqueia venda de produto com estoque negativo\u003c/b> e clique em \u003cb>GRAVAR\u003c/b>."},{"h":"3. Fazer aparecer no caixa"},{"p":"Feche e abra o \u003cb>Pallas Caixa\u003c/b> de novo. Pesquise o produto e faça uma venda de teste para conferir o preço e a nota."},{"h":"Loja de roupa: tamanhos (grade)"},{"steps":["Cadastre os tamanhos uma vez: \u003ckbd>F12\u003c/kbd> → aba \u003cb>Grade\u003c/b> → adicione os tamanhos → \u003cb>Gravar\u003c/b>.","No produto, marque a opção \u003cb>Grade\u003c/b> e grave.","Escolha cada \u003cb>Tamanho\u003c/b>, coloque o estoque dele e clique em \u003cb>Adicionar\u003c/b>. No fim, \u003cb>Gravar\u003c/b>."]},{"h":"Muitos produtos de uma vez"},{"steps":["\u003cb>Importar planilha:\u003c/b> \u003cb>Produtos → Produtos Específicos → Opções → Importar produtos csv → Executar\u003c/b>. Envie a planilha, ligue cada coluna ao campo certo (ex.: a coluna dos nomes em \u003cb>Descrição\u003c/b>) e clique em \u003cb>GRAVAR\u003c/b>.","\u003cb>Mudar vários de uma vez\u003c/b> (grupo, impressora de produção etc.): \u003cb>Produtos → Produtos Específicos → Opções → Alteração em Massa → Executar → Pesquisar\u003c/b>. Selecione a coluna, troque o valor e clique em \u003cb>Gravar\u003c/b>."]},{"h":"Vídeos"},{"videos":[["Cadastro de produto no Pallas","https://www.youtube.com/watch?v=9KrV9CE9j10"],["Introdução ao Retaguarda (playlist)","https://www.youtube.com/playlist?list=PLR4ercb3HY6WWHnopKyTiX7kNaZ-ycBWr"]]},{"warn":"Antes de importar ou alterar em massa, peça ao suporte para fazer um backup. Uma alteração errada muda todos os produtos de uma vez."},{"tip":"O produto gravou sem a unidade \"UN\"? No Retaguarda, \u003ckbd>F12\u003c/kbd> → \u003cb>Customização\u003c/b> e confira a opção \u003cb>Remove Un do cadastro de produtos\u003c/b>."}]},{"id":"mentora-videos","cat":"mentora","sis":"mentora","titulo":"Vídeos de ajuda do Mentora","lead":"Os tutoriais em vídeo da Mentora Soluções, separados por assunto. Abrem no YouTube.","tags":"mentora vídeos tutorial youtube pdv mobile erp app produtos serviços whatsapp delivery certificado nfce","corpo":[{"h":"Primeiros passos"},{"videos":[["Apresentação do sistema Mentora","https://www.youtube.com/watch?v=SQpQrLqkymg"],["Como instalar o aplicativo ERP Mobile","https://www.youtube.com/watch?v=F4_u6wq6kEc"],["Instalação do PDV Mobile","https://www.youtube.com/watch?v=vOEwGyxvukU"]]},{"h":"Produtos e serviços"},{"videos":[["Cadastro de produtos automatizado","https://www.youtube.com/watch?v=QVizpQ19aIc"],["Cadastro de produtos no PDV Mobile","https://www.youtube.com/watch?v=R0qc7_yPKvs"],["Cadastrar serviços","https://www.youtube.com/watch?v=QMgwqFFCiFU"]]},{"h":"Delivery"},{"videos":[["Configurar o WhatsApp Delivery","https://www.youtube.com/watch?v=M7fCLe1rMhE"]]},{"h":"Nota fiscal e certificado digital"},{"videos":[["Credenciamento da NFC-e (cupom fiscal)","https://www.youtube.com/watch?v=fznowOJ_Q90"],["Baixar e instalar certificado Certisign","https://www.youtube.com/watch?v=QiBJuH90nC0"],["Baixar certificado digital da Syngular","https://www.youtube.com/watch?v=lN1JYnbskQA"],["Baixar certificado digital Soluti","https://www.youtube.com/watch?v=VbBu2 atch?v=9KrV9CE9j10"],["Receitas com bebidas (ficha técnica)","https://www.youtube.com/watch?v=OjDuvXKSGVw"]]},{"h":"Cardápio digital e delivery"},{"videos":[["Cardápio Digital: configuração completa","https://www.youtube.com/watch?v=2T0riJY5mq0"],["Como controlar o delivery pelo cardápio digital","https://www.youtube.com/watch?v=7bFrgX_7vpE"]]},{"h":"Caixa e pagamentos"},{"videos":[["Caixa integrado com a maquininha do Mercado Pago","https://www.youtube.com/watch?v=oyAGQzu3Us8"],["Comandas com autoatendimento","https://www.youtube.com/watch?v=VfoCN6zS3Gk"]]},{"tip":"Mais vídeos no canal \u003cb>youtube.com/@SistemaPallas\u003c/b>."}]},{"id":"pallas-pix","cat":"pallas","sis":"pallas","titulo":"Receber Pix no Pallas Caixa","lead":"Com o Mercado Pago ligado ao Pallas, o caixa gera o QR Code do Pix e confirma o pagamento sozinho.","tags":"pallas pix qr code mercado pago f10 pagamento caixa","corpo":[{"steps":["No \u003cb>Pallas Caixa\u003c/b>, lance os produtos.","Vá em \u003cb>Pagamentos\u003c/b> (tecla \u003ckbd>F10\u003c/kbd>) e escolha \u003cb>PIX\u003c/b>.","O sistema mostra um \u003cb>QR Code\u003c/b> na tela.","O cliente abre o app do banco, escolhe \u003cb>pagar com Pix QR Code\u003c/b> e aponta a câmera.","Quando o Pix cai, o Pallas confirma o pagamento sozinho."]},{"warn":"Não libere o cliente antes da confirmação aparecer na tela. Print de comprovante no celular do cliente não garante que o Pix caiu."},{"tip":"O QR Code não aparece? A conta do Mercado Pago precisa estar ligada ao Pallas. Chame o suporte."},{"videos":[["Caixa integrado com a maquininha do Mercado Pago","https://www.youtube.com/watch?v=oyAGQzu3Us8"]]}]},{"id":"pallas-kds","cat":"pallas","sis":"pallas","titulo":"Usar a tela da cozinha (Pallas KDS)","lead":"No lugar do papel, os pedidos aparecem numa tela na cozinha. Tudo funciona pelo teclado.","tags":"pallas kds tela cozinha pedidos preparo finalizado cancelado teclado","corpo":[{"table":[["Cor","O que significa"],["Cinza (esquerda)","Pedido novo, esperando para começar"],["Amarelo (direita)","Pedido em preparo"],["Verde","Pedido pronto"]]},{"steps":["Use as \u003cb>setas\u003c/b> do teclado para escolher um pedido.","Aperte \u003ckbd>Enter\u003c/kbd> num pedido cinza para começar a preparar (ele fica amarelo).","Aperte \u003ckbd>Enter\u003c/kbd> num pedido amarelo quando ficar pronto (ele fica verde).","Pronto por engano? Escolha o pedido verde e aperte \u003ckbd>Enter\u003c/kbd>: ele volta para o preparo.","Aperte a \u003cb>barra de espaço\u003c/b> para trocar de tela: em preparo, finalizados e cancelados."]},{"tip":"Pedido não chegou na tela? Veja se o computador do KDS está ligado e na mesma rede do caixa."}]},{"id":"pallas-app-retaguarda","cat":"pallas","sis":"pallas","titulo":"App Pallas Retaguarda no celular","lead":"Acompanhe o faturamento e mexa nos produtos pelo celular, de qualquer lugar.","tags":"pallas app retaguarda celular android ios faturamento ticket médio mais vendidos produtos","corpo":[{"steps":["Baixe o \u003cb>Pallas Retaguarda\u003c/b> na Play Store (Android) ou na App Store (iPhone).","Entre com o mesmo usuário e senha da Nuvem / cardápio digital.","Em \u003cb>Produtos\u003c/b>, veja, inclua ou edite produtos.","Em \u003cb>Relatórios\u003c/b>, veja \u003cb>Faturamento\u003c/b>, \u003cb>Ticket Médio\u003c/b> e \u003cb>Produtos Mais Vendidos\u003c/b>, com filtro por data."]},{"tip":"Esqueceu a senha? Veja \u003ca href=\"#pallas-senha\">Esqueci a senha da Nuvem do Pallas\u003c/a>."}]}],"textos":{"heroTitulo":"Deu problema no caixa? Resolva em poucos passos.","heroTexto":"Tutoriais para quem usa PDV Legal, Pallas, Mentora e Saurus: impressoras, notas em contingência, internet e Windows. Se não resolver, nosso suporte atende pelo WhatsApp.","rodape":"Revenda autorizada PDV Legal. Também atendemos Pallas, Mentora e Saurus. Os menus podem mudar de nome conforme a versão do sistema; em caso de dúvida, chame o suporte antes de alterar configurações fiscais.","destaques":[["Reiniciar spooler","spooler"],["Subir contingência","subir-contingencia"],["Data e hora","data-hora"],["Certificado","certificado-sistema"],["Cadastrar produto","cadastrar-produto"]],"destaquesSuporte":[["Impressora parou","spooler"],["Notas em contingência","subir-contingencia"],["Caixa sem internet","sem-internet"],["Nota rejeitada por horário","data-hora"],["Certificado digital","certificado-sistema"],["Cadastrar produto","cadastrar-produto"]]},"versao":1}</script>
<script>
document.body.classList.add("ed");
/* Núcleo da Central: monta o HTML das páginas a partir dos dados (usado no site e no editor) */
function criarCore(D){
  var SISTEMAS = D.sistemas, CATS = D.cats, ARTIGOS = D.artigos, GUIAS = D.guias, SUP = D.empresa.suporte, T = D.textos || {};
  var esc = function(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
  var norm = function(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); };
  var strip = function(s){ return String(s).replace(/<[^>]+>/g," "); };
  var sisInfo = function(k){ return SISTEMAS[k] || SISTEMAS.geral; };
  var tag = function(sis){ var s = sisInfo(sis); return '<span class="tag" style="--c:var('+s.cor+')">'+(sis==="geral"?"Todos":esc(s.nome))+'</span>'; };
  var supDe = function(sis){ return sis==="saurus" ? [SUP.saurus] : sis==="geral" ? [SUP.geral, SUP.saurus] : [SUP.geral]; };
  var cardSup = function(x, grande){
    return '<a class="scard'+(grande?" big":"")+'" style="--c:var('+x.cor+')" href="https://wa.me/'+esc(x.wa)+'" target="_blank" rel="noopener">'+
      '<span class="scard-q">'+esc(x.pergunta)+'</span><span class="scard-b"><span class="scard-l">Chame neste número:</span><span class="scard-n">'+esc(x.num)+'</span><span class="scard-btn">Chamar no WhatsApp</span></span></a>';
  };
  var textoArtigo = function(a){
    return norm(a.titulo+" "+a.lead+" "+a.tags+" "+a.corpo.map(function(b){
      if(b.guia){ var g = GUIAS[b.guia[0]] && GUIAS[b.guia[0]][b.guia[1]]; return g ? strip(JSON.stringify(g)) : ""; }
      return strip(JSON.stringify(b));
    }).join(" "));
  };
  /* link de navegação: botão no modo normal, link no modo sem JavaScript */
  var irBtn = function(id, label, est, cls){ return est ? '<a'+(cls?' class="'+cls+'"':'')+' href="#'+esc(id)+'">'+label+'</a>' : '<button'+(cls?' class="'+cls+'"':'')+' data-go="'+esc(id)+'">'+label+'</button>'; };

  function bloco(b, est){
    if(b.p) return '<p>'+b.p+'</p>';

  var troca = function(txt, chave, valor){ return txt.split(chave).join(valor); };

      '<button class="ed-btn pri full" id="novoArt">+ Novo artigo</button>'+
      '<input class="ed-in" id="fq" type="search" placeholder="Procurar artigo..." value="'+esc(fArt.q)+'">'+
      '<div class="ed-row2"><select class="ed-in" id="fsis">'+opcoesSis(fArt.sis,true)+'</select><select class="ed-in" id="fcat">'+opcoesCat(fArt.cat,true)+'</select></div>'+
      '<ul id="listaArt"></ul></aside><section class="ed-form" id="formArt"></section></div>';

    fs.onchange = function(e){ fArt.sis = e.target.value; listaArtigos(); };

  function listaArtigos(){
    var q = fArt.q.trim() ? slug(fArt.q).replace(/-/g," ") : "";
    var arts = D.artigos.filter(function(a){
      return (!fArt.sis || a.sis===fArt.sis) && (!fArt.cat || a.cat===fArt.cat) && (!q || slug(a.titulo+" "+a.tags).replace(/-/g," ").indexOf(q)>=0);
    });
    $("#listaArt").innerHTML = arts.map(function(a){
      var cat = D.cats.filter(function(c){ return c.id===a.cat; })[0];
      return '<li><button data-art="'+esc(a.id)+'"'+(a.id===artSel?' aria-current="true"':'')+'><b>'+esc(a.titulo||"(sem título)")+'</b><small>'+esc(a.sis==="geral"?"Todos":D.sistemas[a.sis].nome)+' · '+esc(cat?cat.nome:"sem categoria")+'</small></button></li>';
    }).join("") || '<li class="ed-vazio">Nenhum artigo encontrado.</li>';
  }
  function artAtual(){ return D.artigos.filter(function(a){ return a.id===artSel; })[0]; }
  function novoArtigo(){
    var a = {id:idUnico("novo-artigo", D.artigos), cat:fArt.cat || D.cats[0].id, sis:fArt.sis || "geral", titulo:"", lead:"", tags:"", corpo:[{steps:[""]}], _novo:true};
    D.artigos.unshift(a); artSel = a.id; marcarMudou(); listaArtigos(); formArtigo(); $("#aTit").focus();
  }
  function formArtigo(){
    var f = $("#formArt"), a = artAtual();
    if(!a){ f.innerHTML = '<div class="ed-vazio-grande"><h2>Escolha um artigo na lista</h2><p>Ou clique em <b>+ Novo artigo</b> para criar um.</p>'+ajudaFormatacao()+'</div>'; return; }
    f.innerHTML = '<div class="ed-formtop"><h2>'+(a.titulo?esc(a.titulo):"Novo artigo")+'</h2><div class="ed-row">'+
      '<button class="ed-btn" id="prevBtn">Ver prévia</button><button class="ed-btn" id="dupBtn">Duplicar</button><button class="ed-btn perigo-l" id="delBtn">Apagar</button></div></div>'+
      '<div class="ed-campos">'+
      '<label class="ed-lab">Título<input class="ed-in" id="aTit" value="'+esc(a.titulo)+'" placeholder="Ex.: Impressora não imprime"></label>'+
      '<div class="ed-row2"><label class="ed-lab">Sistema<select class="ed-in" id="aSis">'+opcoesSis(a.sis,false)+'</select></label><label class="ed-lab">Categoria<select class="ed-in" id="aCat">'+opcoesCat(a.cat,false)+'</select></label></div>'+
      '<label class="ed-lab">Resumo <small>aparece logo abaixo do título</small><textarea class="ed-in" id="aLead" rows="2">'+esc(paraTexto(a.lead))+'</textarea></label>'+
      '<label class="ed-lab">Palavras para a busca <small>como o cliente procuraria, separadas por espaço</small><input class="ed-in" id="aTags" value="'+esc(a.tags)+'"></label>'+
      '<label class="ed-lab">Endereço do artigo <small>usado nos links: #'+esc(a.id)+'</small><input class="ed-in mono" id="aId" value="'+esc(a.id)+'"'+(a._novo?'':' readonly title="Endereço de artigo já publicado não pode mudar, para não quebrar links."')+'></label>'+
      '</div><h3 class="ed-h3">Conteúdo</h3>'+ajudaFormatacao()+'<div id="blocos"></div>'+barraAdd()+
      '<div class="ed-prev" id="prev" hidden></div>';
    $("#aTit").oninput = function(e){
      a.titulo = e.target.value;
      if(a._novo){ var novo = idUnico(slug(a.titulo), D.artigos.filter(function(x){ return x!==a; })); a.id = novo; artSel = novo; $("#aId").value = novo; }
      $(".ed-formtop h2").textContent = a.titulo || "Novo artigo"; marcarMudou(); listaArtigos();
    };
    $("#aSis").onchange = function(e){ a.sis = e.target.value; marcarMudou(); listaArtigos(); };
    $("#aCat").onchange = function(e){ a.cat = e.target.value; marcarMudou(); listaArtigos(); };
    $("#aLead").oninput = function(e){ a.lead = paraHTML(e.target.value); marcarMudou(); };
    $("#aTags").oninput = function(e){ a.tags = e.target.value; marcarMudou(); };
    $("#aId").oninput = function(e){ if(!a._novo) return; var v = slug(e.target.value); a.id = idUnico(v, D.artigos.filter(function(x){ return x!==a; })); artSel = a.id; marcarMudou(); };
    $("#prevBtn").onclick = function(){ var p = $("#prev"); p.hidden = !p.hidden; this.textContent = p.hidden ? "Ver prévia" : "Fechar prévia"; if(!p.hidden){ prevArtigo(); p.scrollIntoView({behavior:"smooth"}); } };
    $("#dupBtn").onclick = function(){ var c = clone(a); c.id = idUnico(a.id+"-copia", D.artigos); c.titulo = a.titulo+" (cópia)"; c._novo = true; D.artigos.splice(D.artigos.indexOf(a)+1, 0, c); artSel = c.id; marcarMudou(); listaArtigos(); formArtigo(); };
    var del = $("#delBtn");
    del.onclick = function(){
      if(!del.dataset.conf){ del.dataset.conf = "1"; del.textContent = "Clique de novo para apagar"; del.classList.add("perigo"); return; }
      D.artigos.splice(D.artigos.indexOf(a), 1); artSel = null; marcarMudou(); listaArtigos(); formArtigo();
    };
    editorBlocos($("#blocos"), a.corpo, function(){ if(!$("#prev").hidden) prevArtigo(); });

  /* Editor de blocos (usado nos artigos e nos guias) */
  function editorBlocos(el, corpo, aoMudar){
    el.innerHTML = corpo.map(function(b, i){ return cardBloco(b, i, corpo.length); }).join("") || '<p class="ed-vazio">Sem conteúdo. Use os botões abaixo para adicionar.</p>';
    var mudou = function(){ marcarMudou(); if(aoMudar) aoMudar(); };
    $$("[data-bi]", el).forEach(function(card){
      var i = +card.dataset.bi, b = corpo[i], t = tipoDe(b);
      var campo = $(".ed-campo", card);
      if(campo) campo.oninput = function(){
        var v = campo.value;
        if(t==="p"||t==="h"||t==="tip"||t==="warn") b[t] = paraHTML(v);
        else if(t==="steps") b.steps = v.split("\n").map(function(x){ return x.trim(); }).filter(Boolean).map(paraHTML);
        else if(t==="cmd") b.cmd = v;
        else if(t==="videos") b.videos = v.split("\n").map(function(x){ var p = x.split("|"); return [p[0].trim(), (p.slice(1).join("|")||"").trim()]; }).filter(function(x){ return x[0]; });
        else if(t==="table") b.table = v.split("\n").filter(function(x){ return x.trim(); }).map(function(x){ return x.split("|").map(function(c){ return paraHTML(c.trim()); }); });
        mudou();
      };
      $$("select[data-k]", card).forEach(function(s){ s.onchange = function(){
        if(t==="guia") b.guia[s.dataset.k==="g"?0:1] = s.value;
        if(t==="tabs") b.src = s.value;
        if(t==="fig") b.fig = s.value;
        mudou(); editorBlocos(el, corpo, aoMudar);
      }; });
      $$("[data-acao]", card).forEach(function(btn){ btn.onclick = function(){
        var ac = btn.dataset.acao;
        if(ac==="sobe" && i>0){ corpo.splice(i-1, 0, corpo.splice(i,1)[0]); }
        else if(ac==="desce" && i<corpo.length-1){ corpo.splice(i+1, 0, corpo.splice(i,1)[0]); }
        else if(ac==="tira"){
          if(!btn.dataset.conf){ btn.dataset.conf="1"; btn.textContent="Apagar?"; btn.classList.add("perigo"); return; }
          corpo.splice(i,1);
        } else return;
        mudou(); editorBlocos(el, corpo, aoMudar);
      }; });
    });
  }
  function cardBloco(b, i, n){
    var t = tipoDe(b), info = TIPOS[t], campo = "";
    if(t==="p"||t==="tip"||t==="warn") campo = '<textarea class="ed-in ed-campo" rows="3">'+esc(paraTexto(b[t]))+'</textarea>';
    else if(t==="h") campo = '<input class="ed-in ed-campo strong" value="'+esc(paraTexto(b.h))+'">';
    else if(t==="steps") campo = '<textarea class="ed-in ed-campo" rows="'+Math.max(3, b.steps.length+1)+'">'+esc(b.steps.map(paraTexto).join("\n"))+'</textarea>';
    else if(t==="cmd") campo = '<input class="ed-in ed-campo mono" value="'+esc(b.cmd)+'">';
    else if(t==="videos") campo = '<textarea class="ed-in ed-campo mono-s" rows="'+Math.max(2, b.videos.length+1)+'">'+esc(b.videos.map(function(v){ return v[0]+" | "+v[1]; }).join("\n"))+'</textarea>';
    else if(t==="table") campo = '<textarea class="ed-in ed-campo mono-s" rows="'+Math.max(3, b.table.length+1)+'">'+esc(b.table.map(function(r){ return r.map(paraTexto).join(" | "); }).join("\n"))+'</textarea>';
    else if(t==="guia") campo = '<div class="ed-row2"><select class="ed-in" data-k="g">'+Object.keys(GUIA_NOMES).map(function(g){ return '<option value="'+g+'"'+(b.guia[0]===g?" selected":"")+'>'+GUIA_NOMES[g]+'</option>'; }).join("")+'</select><select class="ed-in" data-k="k">'+SIS_ORDEM.map(function(k){ return '<option value="'+k+'"'+(b.guia[1]===k?" selected":"")+'>'+esc(D.sistemas[k].nome)+'</option>'; }).join("")+'</select></div>';
    else if(t==="tabs") campo = '<select class="ed-in" data-k="src">'+Object.keys(GUIA_NOMES).map(function(g){ return '<option value="'+g+'"'+((b.src||"cont")===g?" selected":"")+'>'+GUIA_NOMES[g]+'</option>'; }).join("")+'</select>';
    else if(t==="fig") campo = '<select class="ed-in" data-k="fig">'+Object.keys(FIGS).map(function(k){ return '<option value="'+k+'"'+(b.fig===k?" selected":"")+'>'+FIGS[k]+'</option>'; }).join("")+'</select>';
    return '<div class="ed-bloco t-'+t+'" data-bi="'+i+'"><div class="ed-bloco-h"><span class="ed-tipo">'+info.nome+'</span><span class="ed-ajuda">'+esc(info.ajuda)+'</span>'+
      '<span class="ed-acoes"><button data-acao="sobe" title="Subir"'+(i===0?" disabled":"")+'>↑</button><button data-acao="desce" title="Descer"'+(i===n-1?" disabled":"")+'>↓</button><button data-acao="tira" title="Apagar bloco">✕</button></span></div>'+campo+'</div>';
  }
  function barraAdd(){
    var tipos = ["p","h","steps","cmd","tip","warn","videos","table","guia"];
    return '<div class="ed-add"><span>Adicionar:</span>'+tipos.map(function(t){ return '<button class="ed-btn sm" data-add="'+t+'">+ '+TIPOS[t].nome+'</button>'; }).join("")+'</div>';
  }
  function ligarAdd(raiz, corpo, depois){
    $$("[data-add]", raiz).forEach(function(btn){ btn.onclick = function(){
      var t = btn.dataset.add, b = {};
      if(t==="steps") b.steps = [""]; else if(t==="videos") b.videos = []; else if(t==="table") b.table = [["Coluna 1","Coluna 2"],["",""]];
      else if(t==="guia") b.guia = ["cont","pdvlegal"]; else b[t] = "";
      corpo.push(b); marcarMudou(); depois();
      var cards = $$(".ed-bloco", raiz); var ult = cards[cards.length-1]; if(ult){ ult.scrollIntoView({behavior:"smooth", block:"center"}); var c = $(".ed-campo", ult); if(c) c.focus(); }
    }; });
  }

  function telaGuias(m){

      '<div class="ed-pills">'+Object.keys(GUIA_NOMES).map(function(g){ return '<button class="ed-pill" data-g="'+g+'"'+(guiaSel.g===g?' aria-current="true"':'')+'>'+GUIA_NOMES[g]+'</button>'; }).join("")+'</div>'+
      '<div class="ed-pills sis">'+SIS_ORDEM.map(function(k){ return '<button class="ed-pill" data-k="'+k+'"'+(guiaSel.k===k?' aria-current="true"':'')+' style="--c:var('+D.sistemas[k].cor+')">'+esc(D.sistemas[k].nome)+'</button>'; }).join("")+'</div>'+
      (usos.length?'<p class="ed-hint">Aparece em: '+usos.join(", ")+'</p>':'')+'</div>'+
      '<div class="ed-card"><h3 class="ed-h3">'+GUIA_NOMES[guiaSel.g]+' · '+esc(D.sistemas[guiaSel.k].nome)+'</h3>'+ajudaFormatacao()+'<div id="blocos"></div>'+barraAdd().replace('<button class="ed-btn sm" data-add="guia">+ Guia por sistema</button>','')+'</div>';
    $$("[data-g]", m).forEach(function(b){ b.onclick = function(){ guiaSel.g = b.dataset.g; render(); }; });
    $$("[data-k]", m).forEach(function(b){ if(b.classList.contains("ed-pill")) b.onclick = function(){ guiaSel.k = b.dataset.k; render(); }; });

    var corpo = D.guias[guiaSel.g][guiaSel.k];
    editorBlocos($("#blocos"), corpo);
    ligarAdd(m, corpo, function(){ render(); });

      $("select", row).onchange = function(e){ lista[i][1] = e.target.value; marcarMudou(); };
      $$("[data-acao]", row).forEach(function(b){ b.onclick = function(){
        var ac = b.dataset.acao;

        else if(ac==="desce" && i<lista.length-1) lista.splice(i+1,0,lista.splice(i,1)[0]);
