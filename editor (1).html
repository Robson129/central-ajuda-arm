  /* Conferir e gerar */
  function conferir(){
    var p = [], ids = {};
    D.artigos.forEach(function(a){ ids[a.id] = a; });
    var ok = function(id){ return id==="inicio" || id==="suporte" || !!ids[id]; };
    var catIds = D.cats.map(function(c){ return c.id; });
    var nomeA = function(a){ return '<a href="#" data-abrir="'+esc(a.id)+'">'+esc(a.titulo||"(sem título)")+'</a>'; };
    var titulos = {};
    D.artigos.forEach(function(a){
      if(!a.titulo.trim()) p.push(["erro", nomeA(a)+": artigo sem título."]);
      else if(titulos[a.titulo.trim().toLowerCase()]) p.push(["aviso", nomeA(a)+": já existe outro artigo com esse título."]);
      titulos[a.titulo.trim().toLowerCase()] = 1;
      if(catIds.indexOf(a.cat) < 0) p.push(["erro", nomeA(a)+": a categoria dele não existe mais. Escolha outra."]);
      if(!a.corpo.length) p.push(["aviso", nomeA(a)+": artigo sem conteúdo."]);
      var txt = JSON.stringify(a.corpo) + a.lead;
      (txt.match(/href=\\?"#([^"\\]+)\\?"/g) || []).forEach(function(m){ var id = m.replace(/^href=\\?"#/,"").replace(/\\?"$/,""); if(!ok(id)) p.push(["erro", nomeA(a)+': link para "#'+esc(id)+'", que não existe.']); });
      a.corpo.forEach(function(b){
        if(b.videos) b.videos.forEach(function(v){ if(!/^https?:\/\//.test(v[1])) p.push(["erro", nomeA(a)+': o vídeo "'+esc(v[0])+'" está sem link (precisa começar com https://).']); });
        if(b.steps && !b.steps.length) p.push(["aviso", nomeA(a)+": tem um passo a passo vazio."]);
      });
    });
    Object.keys(D.guias).forEach(function(g){ Object.keys(D.guias[g]).forEach(function(k){
      (JSON.stringify(D.guias[g][k]).match(/href=\\?"#([^"\\]+)\\?"/g) || []).forEach(function(m){ var id = m.replace(/^href=\\?"#/,"").replace(/\\?"$/,""); if(!ok(id)) p.push(["erro", 'Guia "'+GUIA_NOMES[g]+' · '+esc(D.sistemas[k].nome)+'": link para "#'+esc(id)+'", que não existe.']); });
    }); });
    [["destaques","página inicial"],["destaquesSuporte","aba Suporte"]].forEach(function(x){ (D.textos[x[0]]||[]).forEach(function(d){ if(!ok(d[1])) p.push(["erro", 'Atalho "'+esc(d[0])+'" da '+x[1]+' aponta para um artigo que não existe.']); }); });
    D.cats.forEach(function(c){ if(!D.artigos.some(function(a){ return a.cat===c.id; })) p.push(["aviso", 'A categoria "'+esc(c.nome)+'" está vazia e não vai aparecer no site.']); });
    return p;
  }
  function gerarHTML(){
    var dados = clone(D); dados.artigos.forEach(function(a){ delete a._novo; });
    return gerarSite(dados, MODELO, true);
  }
  /* ---------- publicar direto no GitHub ---------- */
  var GH_KEY = "central-editor-github";
  function ghCfg(){ try { return JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch(e){ return null; } }
  function ghSalvar(c){ try { c ? localStorage.setItem(GH_KEY, JSON.stringify(c)) : localStorage.removeItem(GH_KEY); return true; } catch(e){ return false; } }
  function ghRepo(txt){ var m = String(txt||"").trim().replace(/\.git$/,"").replace(/\/+$/,"").match(/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/); return m ? m[1]+"/"+m[2] : ""; }
  function b64(str){ var bytes = new TextEncoder().encode(str), bin = ""; for(var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(bin); }
  function deb64(s){ var bin = atob(String(s).replace(/\s/g,"")), bytes = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function ghReq(c, metodo, caminho, corpo, aceitar){
    return fetch("https://api.github.com/repos/"+c.repo+caminho, {
      method: metodo, cache: "no-store",
      headers: {"Authorization":"Bearer "+c.token, "Accept":aceitar||"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"},
      body: corpo ? JSON.stringify(corpo) : undefined
    }).then(function(r){
      if(r.ok) return aceitar ? r.text() : r.json();
      return r.text().then(function(t){ var e = new Error(t); e.status = r.status; throw e; });
    });
  }
  function ghErro(e, c){
    var st = e && e.status;
    if(st===401) return "A chave de acesso não funcionou. Ela pode estar errada ou ter vencido. Crie uma chave nova e cole de novo.";
    if(st===403) return "A chave não tem permissão para gravar. Na criação da chave, em Contents, escolha Read and write.";
    if(st===404) return "Não achei o repositório \""+c.repo+"\" (ramo \""+c.branch+"\"). Confira o nome e se a chave tem acesso a esse repositório.";
    if(st===409 || st===422) return "O arquivo mudou no GitHub enquanto você publicava. Tente publicar de novo.";
    if(!st) return "Não deu para falar com o GitHub. Confira a internet. Se você está usando o editor pelo link do Claude, abra pelo endereço do site (…/editor.html): só lá a publicação direta funciona.";
    return "O GitHub respondeu com erro "+st+". Tente de novo em alguns minutos.";
  }
  function ghLerArquivo(c){
    return ghReq(c, "GET", "/contents/index.html?ref="+encodeURIComponent(c.branch)).then(function(info){
      if(info.content) return {sha:info.sha, html:deb64(info.content)};
      return ghReq(c, "GET", "/contents/index.html?ref="+encodeURIComponent(c.branch), null, "application/vnd.github.raw+json").then(function(html){ return {sha:info.sha, html:html}; });
    });
  }
  function semNovos(){ var d = clone(D); d.artigos.forEach(function(a){ delete a._novo; }); return d; }

  function cardPublicar(){
    var c = ghCfg();
    if(!c) return '<div class="ed-card ed-pub"><h3 class="ed-h3">Publicar direto no site</h3><p class="ed-hint">Ligue o editor ao repositório da central no GitHub uma vez. Depois disso, um clique em <b>Publicar no site</b> já atualiza o site.</p>'+
      '<details class="ed-fmt" open><summary>Como criar a chave de acesso (5 minutos, uma vez só)</summary><ol class="ed-ol">'+
      '<li>Entre no GitHub com a conta dona do repositório da central.</li>'+
      '<li>Clique na sua foto (canto superior direito) → <b>Settings</b> → no fim do menu da esquerda, <b>Developer settings</b>.</li>'+
      '<li>Clique em <b>Personal access tokens → Fine-grained tokens → Generate new token</b>.</li>'+
      '<li><b>Token name:</b> "Editor da central". <b>Expiration:</b> escolha um prazo (ex.: 1 ano). Quando vencer, é só criar outra.</li>'+
      '<li><b>Repository access:</b> marque <b>Only select repositories</b> e escolha só o repositório da central.</li>'+
      '<li>Em <b>Permissions → Repository permissions</b>, procure <b>Contents</b> e escolha <b>Read and write</b>. Não mexa no resto.</li>'+
      '<li>Clique em <b>Generate token</b> e copie o código que começa com <code>github_pat_</code>. Ele só aparece uma vez.</li></ol></details>'+
      '<div class="ed-campos" style="margin-top:12px"><label class="ed-lab">Repositório <small>cole o endereço do repositório, ex.: https://github.com/seu-usuario/central-ajuda-arm</small><input class="ed-in" id="ghRepo" placeholder="https://github.com/seu-usuario/central-ajuda-arm"></label>'+
      '<label class="ed-lab">Chave de acesso<input class="ed-in mono" id="ghToken" type="password" placeholder="github_pat_..." autocomplete="off"></label>'+
      '<label class="ed-lab">Ramo <small>quase sempre é main; só mude se souber que é outro</small><input class="ed-in mono" id="ghBranch" value="main"></label>'+
      '<div class="ed-row"><button class="ed-btn pri" id="ghLigar">Ligar ao GitHub</button></div><p class="ed-hint" id="ghMsg"></p>'+
      '<p class="ed-hint">A chave fica guardada só neste navegador, deste computador. Não ligue em computador de uso público. Cada pessoa que for publicar liga uma vez no próprio computador.</p></div></div>';
    return '<div class="ed-card ed-pub"><h3 class="ed-h3">Publicar direto no site</h3><p class="ed-hint">Ligado a <b>'+esc(c.repo)+'</b> (ramo '+esc(c.branch)+'). <button class="ed-link" id="ghDesligar">Desligar deste navegador</button></p>'+
      '<label class="ed-lab">O que mudou <small>aparece no histórico do GitHub</small><input class="ed-in" id="ghMsgCommit" placeholder="Ex.: novo artigo de balança; troca do número da Saurus"></label>'+
      '<div class="ed-row" style="margin-top:10px"><button class="ed-btn pub" id="ghPublicar">Publicar no site</button></div><div id="ghRes" class="ed-hint" aria-live="polite"></div></div>';
  }
  function ligarPublicar(){
    var c = ghCfg();
    if(!c){
      $("#ghLigar").onclick = function(){
        var repo = ghRepo($("#ghRepo").value), token = $("#ghToken").value.trim(), branch = ($("#ghBranch").value.trim() || "main"), msgEl = $("#ghMsg");
        if(!repo){ msgEl.textContent = "Cole o endereço do repositório, como https://github.com/seu-usuario/central-ajuda-arm."; return; }
        if(!token){ msgEl.textContent = "Cole a chave de acesso."; return; }
        var nc = {repo:repo, token:token, branch:branch};
        msgEl.textContent = "Testando a ligação...";
        ghReq(nc, "GET", "").then(function(info){
          if(info.permissions && info.permissions.push === false) throw {status:403};
          return ghReq(nc, "GET", "/contents/index.html?ref="+encodeURIComponent(branch)).then(function(){ return "ok"; }, function(e){ if(e.status===404) return "sem-arquivo"; throw e; });
        }).then(function(r){
          if(!ghSalvar(nc)){ msgEl.textContent = "Este navegador não deixou guardar a chave. Tente em outro navegador."; return; }
          telaGerar($("#main"));
          $("#ghRes").textContent = r==="ok" ? "Ligado. Pode publicar." : "Ligado. O repositório ainda não tem index.html: a primeira publicação vai criar o arquivo.";
        }).catch(function(e){ msgEl.textContent = ghErro(e, nc); });
      };
      return;
    }
    var des = $("#ghDesligar");
    des.onclick = function(){ if(!des.dataset.conf){ des.dataset.conf = "1"; des.textContent = "Clique de novo para desligar"; return; } ghSalvar(null); telaGerar($("#main")); };
    $("#ghPublicar").onclick = function(){ publicar(false); };
  }
  function publicar(forcar){
    var c = ghCfg(), res = $("#ghRes"), btn = $("#ghPublicar");
    var mensagem = ($("#ghMsgCommit").value.trim() || "Atualização da central pelo editor");
    var dados = semNovos(), html = gerarSite(dados, MODELO, true);
    btn.disabled = true; res.innerHTML = "Conferindo a versão que está no site...";
    var falhou = function(e){ btn.disabled = false; res.innerHTML = '<span class="ed-erro">'+esc(ghErro(e, c))+'</span>'; };
    ghLerArquivo(c).then(function(atual){ return atual; }, function(e){ if(e.status===404) return {sha:null, html:""}; throw e; }).then(function(atual){
      var remoto = atual.html ? extrairDados(atual.html) : null;
      if(!forcar && remoto && JSON.stringify(remoto) !== ORIG && JSON.stringify(remoto) !== JSON.stringify(dados)){
        btn.disabled = false;
        res.innerHTML = '<div class="ed-conflito"><b>O site publicado está diferente da versão que você abriu.</b> Pode ser que outra pessoa tenha publicado depois que você começou. Se publicar agora, o que ela mudou será substituído pelo seu conteúdo.'+
          '<div class="ed-row" style="margin-top:8px"><button class="ed-btn perigo" id="ghForcar">Publicar mesmo assim</button><button class="ed-btn" id="ghCancelar">Cancelar</button></div></div>';
        $("#ghForcar").onclick = function(){ publicar(true); };
        $("#ghCancelar").onclick = function(){ res.textContent = "Publicação cancelada. Dica: baixe uma cópia de segurança do seu rascunho, recarregue o editor para abrir a versão publicada e refaça suas mudanças nela."; };
        return;
      }
      res.innerHTML = "Publicando...";
      var corpo = {message:mensagem, content:b64(html), branch:c.branch};
      if(atual.sha) corpo.sha = atual.sha;
      return ghReq(c, "PUT", "/contents/index.html", corpo).then(function(r){
        btn.disabled = false;
        ORIG = JSON.stringify(dados); D = dados; origem = "site";
        try { localStorage.removeItem(CHAVE); } catch(e){}
        var hora = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        var link = r && r.commit && r.commit.html_url;
        res.innerHTML = '<span class="ed-ok">Publicado às '+hora+'.</span> O Vercel atualiza o site em até 1 minuto. Depois abra o site e aperte <b>Ctrl + F5</b>.'+(link?' <a href="'+esc(link)+'" target="_blank" rel="noopener">Ver no GitHub</a>':'');
        $("#ghMsgCommit").value = "";
        setStatus(); $$(".ed-resumo div")[1].querySelector("b").textContent = "0";
      });
    }).catch(falhou);
  }

  function telaGerar(m){
    var p = conferir(), erros = p.filter(function(x){ return x[0]==="erro"; }).length, n = contarMudancas();
    m.innerHTML = '<div class="ed-card"><h2>Publicar</h2><p class="ed-hint">Confira os problemas e publique. Os clientes só veem as mudanças depois de publicar.</p>'+
      '<div class="ed-resumo"><div><b>'+D.artigos.length+'</b><span>artigos</span></div><div><b>'+n+'</b><span>alterações</span></div><div class="'+(erros?"ruim":"bom")+'"><b>'+(erros||"0")+'</b><span>problemas</span></div></div></div>'+
      '<div class="ed-card"><h3 class="ed-h3">1. Conferir</h3>'+(p.length ? '<ul class="ed-probs">'+p.map(function(x){ return '<li class="'+x[0]+'"><span>'+(x[0]==="erro"?"Corrigir":"Aviso")+'</span>'+x[1]+'</li>'; }).join("")+'</ul>' : '<p class="ed-ok">Tudo certo. Nenhum problema encontrado.</p>')+
      (erros?'<p class="ed-hint">Dá para publicar mesmo com problemas, mas o ideal é corrigir antes.</p>':'')+'</div>'+
      cardPublicar()+
      '<details class="ed-card ed-alt"><summary><b>Outra forma: baixar o arquivo e subir na mão</b></summary>'+
      '<div class="ed-row" style="margin-top:12px"><button class="ed-btn" id="baixar">Baixar index.html</button><button class="ed-btn" id="copiar">Copiar código do site</button><button class="ed-btn" id="abrirPrev">Ver o site gerado</button></div><p class="ed-hint" id="msgGerar"></p><textarea class="ed-in mono-s" id="codigo" rows="6" hidden readonly></textarea>'+
      '<ol class="ed-ol"><li>Abra o repositório da central no GitHub.</li><li>Clique em <b>Add file → Upload files</b> e arraste o <b>index.html</b> baixado.</li><li>Escreva o que mudou e clique em <b>Commit changes</b>.</li></ol>'+
      '<p class="ed-hint"><b>Copiou o código em vez de baixar?</b> No GitHub, abra o <b>index.html</b>, clique no lápis, apague tudo (<b>Ctrl + A</b>, <b>Delete</b>), cole (<b>Ctrl + V</b>) e clique em <b>Commit changes</b>.</p></details>'+
      '<div class="ed-card"><h3 class="ed-h3">Cópia de segurança</h3><p class="ed-hint">Guarde ou passe para outra pessoa o conteúdo inteiro num arquivo .json.</p><div class="ed-row"><button class="ed-btn" id="bkpBaixar">Baixar cópia de segurança</button><label class="ed-btn">Abrir cópia de segurança ou index.html<input type="file" id="bkpAbrir" accept=".json,.html" hidden></label></div><p class="ed-hint" id="msgBkp"></p></div>';
    $$("[data-abrir]", m).forEach(function(l){ l.onclick = function(e){ e.preventDefault(); artSel = l.dataset.abrir; aba = "artigos"; render(); }; });
    ligarPublicar();
    var msg = function(t){ $("#msgGerar").textContent = t; };
    $("#baixar").onclick = function(){
      try { baixar("index.html", gerarHTML(), "text/html"); msg("Arquivo gerado. Se o download não começar, use \"Copiar código do site\"."); }
      catch(e){ msg("Este navegador não deixou baixar. Use \"Copiar código do site\"."); }
    };
    $("#copiar").onclick = function(){
      var html = gerarHTML(), ta = $("#codigo");
      var mostrar = function(){ ta.hidden = false; ta.value = html; ta.focus(); ta.select(); msg("O código está selecionado na caixa abaixo. Aperte Ctrl + C para copiar."); };
      try { navigator.clipboard.writeText(html).then(function(){ msg("Código copiado. Agora cole no index.html do GitHub."); }, mostrar); } catch(e){ mostrar(); }
    };
    $("#abrirPrev").onclick = function(){
      try { var u = URL.createObjectURL(new Blob([gerarHTML()], {type:"text/html"})); var w = window.open(u, "_blank"); if(!w) throw 0; msg("O site gerado abriu numa nova aba."); }
      catch(e){ msg("Não deu para abrir uma nova aba aqui. Baixe o arquivo e abra no navegador."); }
    };
    $("#bkpBaixar").onclick = function(){ try { baixar("central-ajuda-dados.json", JSON.stringify(semNovos(), null, 1), "application/json"); } catch(e){ $("#msgBkp").textContent = "Este navegador não deixou baixar."; } };
    $("#bkpAbrir").onchange = function(e){
      var f = e.target.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var txt = String(r.result), d = null;
        try { d = /^\s*</.test(txt) ? extrairDados(txt) : JSON.parse(txt); } catch(err){}
        if(!d || !d.artigos){ $("#msgBkp").textContent = "Esse arquivo não é uma cópia da central."; return; }
        D = d; origem = "arquivo"; marcarMudou(); render(); $("#status").textContent = "Conteúdo aberto do arquivo " + f.name;
      };
      r.readAsText(f);
    };
  }
  function baixar(nome, conteudo, tipo){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([conteudo], {type:tipo+";charset=utf-8"}));
    a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- eventos gerais ---------- */
  document.addEventListener("click", function(e){
    var t = e.target.closest(".ed-tab");
    if(t){ e.preventDefault(); aba = t.dataset.aba; render(); window.scrollTo(0,0); return; }
    var b = e.target.closest("[data-art]");
    if(b){ artSel = b.dataset.art; listaArtigos(); formArtigo(); var f = $("#formArt"); if(f && window.innerWidth < 900) f.scrollIntoView({behavior:"smooth"}); return; }
    var pv = e.target.closest(".pv a[href^='#']");
    if(pv){ e.preventDefault(); var id = pv.getAttribute("href").slice(1); if(D.artigos.some(function(a){ return a.id===id; })){ artSel = id; listaArtigos(); formArtigo(); window.scrollTo(0,0); } return; }
    var pvb = e.target.closest(".pv button");
    if(pvb){ e.preventDefault(); }
  });
  window.addEventListener("beforeunload", function(){ clearTimeout(salvarT); try { if(D) localStorage.setItem(CHAVE, JSON.stringify({dados:D, quando:new Date().toISOString(), origem:origem, base:ORIG})); } catch(e){} });
  iniciar();
})();

</script>
