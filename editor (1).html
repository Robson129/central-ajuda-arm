<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor da Central</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: barra de busca no topo, filtros por sistema, grade de categorias; artigo abre na mesma página com passos numerados e comandos copiáveis. Detalhe do mundo do PDV: cupom térmico serrilhado. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14232e; --muted:#5a6b78; --line:#d8e0e6;
  --accent:#1769b8; --accent-ink:#ffffff; --accent-soft:#e3eefa;
  --warn:#9a5b00; --warn-bg:#fff4e0; --tip:#1d6b3f; --tip-bg:#e7f5ec;
  --code-bg:#14232e; --code-fg:#e8f1f5;
  --pallas:#c2410c; --mentora:#6d28d9; --saurus:#047857; --pdvlegal:#be185d; --sup1:#1769b8; --sup2:#047857; --wa:#128c4a; --geral:#1769b8;
  --f-display:"Bricolage Grotesque", "Archivo", system-ui, sans-serif;
  --f-body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
/* Sempre no modo claro, independente do tema do aparelho */
:root, :root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{background:#030605;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand img{height:52px;width:auto;display:block}
.brand .sep{width:1px;height:28px;background:#ffffff33}
.brand #brandName{color:#e8f1f5;font-weight:600;font-size:1rem}
header.top .contact{color:#9fb3bd}header.top .contact b{color:#ffffff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.brand .mark{width:30px;height:34px;background:var(--accent);
  -webkit-mask:linear-gradient(#000,#000) top/100% 80% no-repeat, conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) bottom/8px 7px repeat-x;
  mask:linear-gradient(#000,#000) top/100% 80% no-repeat, conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) bottom/8px 7px repeat-x}
.contact{font-size:.9rem;color:var(--muted)}
.contact b{color:var(--ink);font-variant-numeric:tabular-nums}

.hero{padding-block:28px 22px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.5vw,2.9rem);line-height:1.08;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0 0 20px;color:var(--muted);max-width:60ch}
.search{position:relative;max-width:680px}
.search input{width:100%;padding:16px 18px 16px 48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.05rem}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:.88rem;color:var(--muted);align-items:center}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.88rem}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-block:18px 22px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 10px;min-width:0}
.cat h2{font-family:var(--f-display);font-weight:600;font-size:1.12rem;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.cat h2 .sq{width:12px;height:12px;border-radius:3px;background:var(--c)}
.cat .desc{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.cat ul{list-style:none;margin:0;padding:0}
.cat li a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.95rem}
.cat li a:hover{color:var(--accent)}
.cat li a::after{content:"›";color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;color:var(--c);border:1px solid var(--c)}

/* artigo */
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;padding-top:8px}
@media (max-width:860px){.article{grid-template-columns:minmax(0,1fr)}.aside{order:2}}
.back{background:none;border:none;color:var(--accent);padding:0;margin:10px 0 18px;font-weight:600}
.art{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(18px,4vw,40px) 34px;min-width:0}
.art h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.15;margin:12px 0 8px;text-wrap:balance}
.art .lead{color:var(--muted);margin:0 0 22px;max-width:65ch}
.art h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:28px 0 10px}
.art p{max-width:68ch;margin:0 0 14px}
.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 18px;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.steps li>div{padding-top:3px}
kbd{font-family:var(--f-mono);font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.cmd{background:var(--code-bg);color:var(--code-fg);border-radius:10px;margin:6px 0 16px;display:flex;align-items:stretch;overflow:hidden}
.cmd pre{margin:0;padding:14px 16px;overflow-x:auto;flex:1;font-family:var(--f-mono);font-size:.92rem;line-height:1.6}
.cmd button{border:none;border-left:1px solid #ffffff22;background:transparent;color:var(--code-fg);padding:0 16px;font-size:.82rem;font-weight:600;white-space:nowrap}
.cmd button:hover{background:#ffffff14}
.note{border-radius:10px;padding:12px 16px;margin:4px 0 16px;font-size:.95rem;max-width:72ch}
.note b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.tip{background:var(--tip-bg);color:var(--ink)} .note.tip b{color:var(--tip)}
.note.warn{background:var(--warn-bg);color:var(--ink)} .note.warn b{color:var(--warn)}
.aside{min-width:0}
.aside h4{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.aside ul{list-style:none;padding:0;margin:0 0 26px}
.aside li a{display:block;padding:7px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:.93rem}
.aside li a:hover{color:var(--accent)}
.help{background:var(--ink);color:var(--bg);border-radius:12px;padding:18px;position:relative}
.help p{margin:0 0 8px;font-size:.92rem}
.help .wa{display:block;color:inherit;text-decoration:none;padding:8px 0;border-top:1px solid #ffffff22}
.help .wa:hover .num{text-decoration:underline}
.help .num{display:block;font-family:var(--f-mono);font-size:1.05rem;font-weight:500;user-select:all}
.help .wa small{opacity:.75;font-size:.82rem}
header.top .ts{font-weight:400;color:#9fb3bd;font-size:.85em}
.receipt{height:8px;margin-top:-1px;background:conic-gradient(from 135deg at 50% 0,var(--ink) 90deg,#0000 0) top/12px 8px repeat-x}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:16px}
.fig{margin:4px 0 20px;max-width:520px}
.fig figcaption{font-size:.88rem;color:var(--muted);margin-top:8px}
.win-search{background:#202a33;border-radius:10px;padding:12px;color:#e8eef2;font-size:.9rem;box-shadow:0 6px 18px #14232e26}
.ws-bar{background:#2d3a45;border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--f-mono)}
.ws-ico{width:12px;height:12px;border:2px solid #9fb3bd;border-radius:50%}
.ws-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.ws-res{display:flex;gap:10px;align-items:center;background:#ffffff14;border-radius:6px;padding:10px;flex:1;min-width:180px}
.ws-res small{display:block;color:#9fb3bd;font-size:.8rem}
.ws-app{background:#0c0c0c;color:#d0d0d0;font-family:var(--f-mono);font-size:.7rem;border-radius:4px;padding:6px 5px;border:1px solid #555}
.ws-menu{list-style:none;margin:0;padding:6px;background:#2b3742;border:1px solid #3d4c58;border-radius:8px;min-width:200px}
.ws-menu li{padding:7px 10px;border-radius:5px;color:#c9d6de}
.ws-menu li.hi{background:#1769b8;color:#fff;font-weight:600}
.win-cmd{background:#0c0c0c;border-radius:8px;overflow:hidden;border:1px solid #2a2a2a;box-shadow:0 6px 18px #14232e26}
.wc-title{background:#f3f3f3;color:#1a1a1a;font-size:.85rem;padding:7px 12px;display:flex;justify-content:space-between;gap:10px}
.wc-title mark{background:#ffe08a;color:#1a1a1a;padding:0 3px;border-radius:3px;font-weight:700}
.wc-btns{color:#555;white-space:nowrap}
.win-cmd pre{margin:0;padding:12px 14px;color:#cccccc;font-family:Consolas,var(--f-mono);font-size:.85rem;overflow-x:auto}
.ticket{background:#fffefa;color:#222;font-family:var(--f-mono);font-size:.82rem;padding:16px 18px 22px;max-width:300px;border:1px solid var(--line);box-shadow:0 6px 16px #14232e1f;
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from 135deg at 50% 100%,#000 90deg,#0000 0) bottom/10px 8px repeat-x;
  mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from 135deg at 50% 100%,#000 90deg,#0000 0) bottom/10px 8px repeat-x}
.t-h{text-align:center;font-weight:600;margin-bottom:10px}
.t-r{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.t-r.hl{background:#ffe08a;margin-inline:-6px;padding-inline:6px;font-weight:600;border-radius:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:6px 0 0}
.tab{border:none;background:transparent;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.tab:hover{color:var(--ink)}
.tabpanel{padding:18px 0 4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:.88rem}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:6px 0 18px}
.vid{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.vid:hover{border-color:var(--accent)}
.vid b{display:block;font-weight:600;font-size:.93rem}
.vid small{color:var(--muted);font-size:.8rem}
.play{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);position:relative}
.play::after{content:"";position:absolute;left:13px;top:10px;border-left:11px solid var(--accent);border-top:7px solid transparent;border-bottom:7px solid transparent}
.tbl{overflow-x:auto;margin:6px 0 18px}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
.tbl th{text-align:left;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:8px 10px}
.tbl td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top;font-variant-numeric:tabular-nums}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.sup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,28px);margin:6px 0 24px}
.sup h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0 0 4px}
.sup-lead{color:var(--muted);margin:0 0 16px;max-width:65ch}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.sup-card{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.sup-card:hover{border-color:var(--accent)}
.sup-for{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sup-sis{display:flex;gap:6px;flex-wrap:wrap}
.sup-num{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums;margin-top:4px}
.sup-go{color:var(--accent);font-weight:600;font-size:.9rem}
.sup-send{border-top:1px solid var(--line);padding-top:14px;font-size:.95rem}
.sup-send ol{margin:8px 0 10px;padding-left:22px;display:grid;gap:4px}
.sup-send p{margin:0;color:var(--muted);font-size:.9rem}
.help .help-send{font-size:.85rem;opacity:.85;margin:10px 0 0;border-top:1px solid #ffffff22;padding-top:10px}
.help .wa small{display:block}
.topsup{background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;padding:9px 16px;border-radius:999px}
.topsup:hover{filter:brightness(1.1)}
.sup-lead b{color:var(--ink)}
.scard{display:flex;flex-direction:column;border:2px solid var(--c);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--surface)}
.scard-q{background:var(--c);color:#fff;font-weight:700;font-family:var(--f-display);font-size:1.05rem;padding:10px 16px}
.scard-b{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px}
.scard-l{font-size:.8rem;color:var(--muted)}
.scard-n{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.scard.big .scard-n{font-size:1.6rem}
.scard-btn{margin-top:8px;align-self:flex-start;background:var(--wa);color:#fff;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:8px}
.scard:hover .scard-btn{filter:brightness(1.1)}
.sup-hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.help-cards{display:grid;gap:10px;margin:10px 0 4px}
.help .scard{background:var(--surface)}
.help .scard-n{font-size:1.1rem}
.help .scard-q{font-size:.95rem;padding:8px 12px}
.help .scard-b{padding:10px 12px 12px}
.topnav{display:flex;gap:4px;background:#ffffff14;border-radius:999px;padding:4px}
.topnav a{color:#c9d6de;text-decoration:none;font-weight:600;font-size:.92rem;padding:7px 16px;border-radius:999px}
.topnav a:hover{color:#fff}
.topnav a[aria-current]{background:#fff;color:#0d1a22}
.fim{margin-top:30px;padding:20px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.fim p{margin:0 0 8px}
.fim-q{font-family:var(--f-display);font-size:1.08rem}
.fim-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0 12px}
.fim-send{color:var(--muted);font-size:.9rem}
.suppage{max-width:820px;padding-block:24px 8px}
.suppage h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 8px}
.sp-lead{color:var(--muted);max-width:62ch;margin:0 0 24px}
.sp-step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--line)}
.sp-n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.sp-body h2{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin:4px 0 12px}
.sp-small{color:var(--muted);font-size:.9rem;margin:12px 0 0}
.sp-warn{margin:0 0 12px}
.sp-list{margin:0;padding-left:22px;display:grid;gap:6px}
.suppage .quick{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.cat,.art{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<style>
/* Editor: barra escura igual à do site, abas de seção, lista à esquerda e formulário à direita. Reaproveita as cores e fontes da central. */
body.ed{background:var(--bg);padding-block:0 60px}
.ed-top{background:#030605;color:#e8f1f5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ed-topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.ed-marca{font-family:var(--f-display);font-weight:800;font-size:1.05rem;margin-right:auto}
.ed-marca small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:#9fb3bd}
.ed-tabs{display:flex;gap:4px;background:#ffffff14;border-radius:999px;padding:4px;flex-wrap:wrap}
.ed-tab{border:none;background:none;color:#c9d6de;font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:999px}
.ed-tab:hover{color:#fff}
.ed-tab[aria-current="page"]{background:#fff;color:#0d1a22}
.ed-tab.gerar{color:#9fe0b8}
.ed-tab.gerar[aria-current="page"]{background:var(--wa);color:#fff}
.ed-sub{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:12px;font-size:.85rem;color:var(--muted)}
.ed-status{display:inline-flex;align-items:center;gap:8px}
.ed-status.pend{color:var(--warn);font-weight:600}
.ed-dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
#main{max-width:1240px;margin:0 auto}
.ed-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;min-width:0}
.ed-card h2,.ed-sec{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0 0 8px}
.ed-sec{margin:26px 0 12px}

function(a){\n    return norm(a.titulo+\" \"+a.lead+\" \"+a.tags+\" \"+a.corpo.map(function(b){\n      if(b.guia){ var g = GUIAS[b.guia[0]] && GUIAS[b.guia[0]][b.guia[1]]; return g ? strip(JSON.stringify(g)) : \"\"; }\n      return strip(JSON.stringify(b));\n    }).join(\" \"));\n  };\n  /* link de navegação: botão no modo normal, link no modo sem JavaScript */\n  var irBtn = function(id, label, est, cls){ return est ? '\u003ca'+(cls?' class=\"'+cls+'\"':'')+' href=\"#'+esc(id)+'\">'+label+'\u003c/a>' : '\u003cbutton'+(cls?' class=\"'+cls+'\"':'')+' data-go=\"'+esc(id)+'\">'+label+'\u003c/button>'; };\n\n  function bloco(b, est){\n    if(b.p) return '\u003cp>'+b.p+'\u003c/p>';\n    if(b.h) return '\u003ch3>'+b.h+'\u003c/h3>';\n    if(b.steps) return '\u003col class=\"steps\">'+b.steps.map(function(s){ return '\u003cli>\u003cdiv>'+s+'\u003c/div>\u003c/li>'; }).join(\"\")+'\u003c/ol>';\n    if(b.cmd) return '\u003cdiv class=\"cmd\">\u003cpre>'+esc(b.cmd)+'\u003c/pre>'+(est?'':'\u003cbutton data-copy=\"'+encodeURIComponent(b.cmd)+'\">Copiar\u003c/button>')+'\u003c/div>';\n    if(b.guia){ var g = GUIAS[b.guia[0]] && GUIAS[b.guia[0]][b.guia[1]]; return g ? g.map(function(x){ return bloco(x, est); }).join(\"\") : \"\"; }\n    if(b.tabs){\n      var src = b.src || \"cont\";\n      var abas = est ? \"\" : '\u003cdiv class=\"tabs\" role=\"tablist\">'+b.tabs.map(function(t,i){ return '\u003cbutton role=\"tab\" class=\"tab\" style=\"--c:var('+sisInfo(t[1]).cor+')\" data-tab=\"'+t[1]+'\" aria-selected=\"'+(i===0)+'\">'+esc(t[0])+'\u003c/button>'; }).join(\"\")+'\u003c/div>';\n      return abas + b.tabs.map(function(t,i){\n        var k = t[1], blocos = (GUIAS[src] && GUIAS[src][k]) || [];\n        return '\u003cdiv class=\"tabpanel\" data-panel=\"'+k+'\"'+(i && !est ? \" hidden\" : \"\")+'>\u003cdiv class=\"tp-h\">'+tag(k)+(src===\"cont\"?'\u003ca href=\"#contingencia-'+k+'\">Abrir só este\u003c/a>':'')+'\u003c/div>'+blocos.map(function(x){ return bloco(x, est); }).join(\"\")+'\u003c/div>';\n      }).join(\"\");\n    }\n    if(b.videos) return '\u003cdiv class=\"vids\">'+b.videos.map(function(v){ return '\u003ca class=\"vid\" href=\"'+esc(v[1])+'\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"play\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cb>'+esc(v[0])+'\u003c/b>\u003csmall>Abre no YouTube\u003c/small>\u003c/span>\u003c/a>'; }).join(\"\")+'\u003c/div>';\n    if(b.table) return '\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>'+b.table[0].map(function(c){ return '\u003cth>'+c+'\u003c/th>'; }).join(\"\")+'\u003c/tr>\u003c/thead>\u003ctbody>'+b.table.slice(1).map(function(r){ return '\u003ctr>'+r.map(function(c){ return '\u003ctd>'+c+'\u003c/td>'; }).join(\"\")+'\u003c/tr>'; }).join(\"\")+'\u003c/tbody>\u003c/table>\u003c/div>';\n    if(b.tip) return '\u003cdiv class=\"note tip\">\u003cb>Dica\u003c/b>'+b.tip+'\u003c/div>';\n    if(b.warn) return '\u003cdiv class=\"note warn\">\u003cb>Atenção\u003c/b>'+b.warn+'\u003c/div>';\n    if(b.fig===\"autoteste\") return '\u003cfigure class=\"fig\" aria-label=\"Exemplo de página de autoteste\">\u003cdiv class=\"ticket\">\u003cdiv class=\"t-h\">*** SELF TEST ***\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>Firmware\u003c/span>\u003cspan>V 2.10\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>Paper width\u003c/span>\u003cspan>80 mm\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>Interface\u003c/span>\u003cspan>Ethernet\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>DHCP\u003c/span>\u003cspan>OFF\u003c/span>\u003c/div>\u003cdiv class=\"t-r hl\">\u003cspan>IP Address\u003c/span>\u003cspan>192.168.0.200\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>Subnet Mask\u003c/span>\u003cspan>255.255.255.0\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>Gateway\u003c/span>\u003cspan>192.168.0.1\u003c/span>\u003c/div>\u003cdiv class=\"t-r\">\u003cspan>MAC\u003c/span>\u003cspan>00:11:62:0A:3F:21\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>Exemplo: a linha \u003cb>IP Address\u003c/b> traz o IP da impressora. O layout muda de marca para marca.\u003c/figcaption>\u003c/figure>';\n    if(b.fig===\"menu\") return '\u003cfigure class=\"fig\" aria-label=\"Exemplo do menu Iniciar\">\u003cdiv class=\"win-search\">\u003cdiv class=\"ws-bar\">\u003cspan class=\"ws-ico\">\u003c/span>cmd\u003c/div>\u003cdiv class=\"ws-row\">\u003cdiv class=\"ws-res\">\u003cspan class=\"ws-app\">C:\\\\_\u003c/span>\u003cdiv>\u003cb>Prompt de Comando\u003c/b>\u003csmall>Aplicativo\u003c/small>\u003c/div>\u003c/div>\u003cul class=\"ws-menu\">\u003cli class=\"hi\">Executar como administrador\u003c/li>\u003cli>Abrir local do arquivo\u003c/li>\u003cli>Fixar em Iniciar\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cfigcaption>Botão direito em Prompt de Comando → \u003cb>Executar como administrador\u003c/b>\u003c/figcaption>\u003c/figure>';\n    if(b.fig===\"janela\") return '\u003cfigure class=\"fig\" aria-label=\"Exemplo da janela do Prompt\">\u003cdiv class=\"win-cmd\">\u003cdiv class=\"wc-title\">\u003cspan>\u003cmark>Administrador:\u003c/mark> Prompt de Comando\u003c/span>\u003cspan class=\"wc-btns\">—&nbsp;&nbsp;▢&nbsp;&nbsp;✕\u003c/span>\u003c/div>\u003cpre>Microsoft Windows [versão 10.0]\\n\\nC:\\\\Windows\\\\system32&gt;net stop spooler_\u003c/pre>\u003c/div>\u003cfigcaption>O título começa com \u003cb>Administrador:\u003c/b> e a pasta é \u003ccode>C:\\\\Windows\\\\system32\u003c/code>. Está certo.\u003c/figcaption>\u003c/figure>';\n    return \"\";\n  }\n\n  function lista(filtro, busca){\n    var termos = norm(busca).split(/\\s+/).filter(Boolean);\n    var ok = function(a){ return (filtro===\"todos\" || a.sis===filtro || a.sis===\"geral\") && termos.every(function(t){ return textoArtigo(a).indexOf(t) >= 0; }); };\n    var chips = [[\"todos\",\"Todos\",null]].concat([\"pdvlegal\",\"pallas\",\"mentora\",\"saurus\"].filter(function(k){ return SISTEMAS[k]; }).map(function(k){ return [k, SISTEMAS[k].nome, SISTEMAS[k].cor]; }))\n      .map(function(c){ return '\u003cbutton class=\"chip\" data-f=\"'+c[0]+'\" aria-pressed=\"'+(filtro===c[0])+'\"'+(c[2]?' style=\"--c:var('+c[2]+')\"':'')+'>'+(c[2]?'\u003cspan class=\"dot\">\u003c/span>':'')+esc(c[1])+'\u003c/button>'; }).join(\"\");\n    /* Com um sistema escolhido: a categoria dele vem primeiro, depois as que têm mais artigos dele; dentro de cada uma, os do sistema antes dos gerais */\n    var doSis = function(c){ return ARTIGOS.filter(function(a){ return a.cat===c.id && a.sis===filtro; }).length; };\n    var ordem = filtro===\"todos\" ? CATS : CATS.slice().sort(function(x,y){ return ((y.id===filtro)-(x.id===filtro)) || (doSis(y)-doSis(x)); });\n    var cards = ordem.map(function(c){\n      var arts = ARTIGOS.filter(function(a){ return a.cat===c.id && ok(a); });\n      if(filtro!==\"todos\") arts = arts.slice().sort(function(x,y){ return (y.sis===filtro)-(x.sis===filtro); });\n      if(!arts.length) return \"\";\n      var cor = SISTEMAS[c.id] ? SISTEMAS[c.id].cor : \"--geral\";\n      return '\u003csection class=\"cat\" style=\"--c:var('+cor+')\">\u003ch2>\u003cspan class=\"sq\">\u003c/span>'+esc(c.nome)+'\u003c/h2>\u003cp class=\"desc\">'+esc(c.desc)+'\u003c/p>\u003cul>'+arts.map(function(a){ return '\u003cli>\u003ca href=\"#'+esc(a.id)+'\">'+esc(a.titulo)+'\u003c/a>\u003c/li>'; }).join(\"\")+'\u003c/ul>\u003c/section>';\n    }).join(\"\");\n    return {chips: chips, cards: cards || '\u003cdiv class=\"empty\">Nenhum artigo encontrado para \"\u003cb>'+esc(busca)+'\u003c/b>\". Tente outra palavra, como \"impressora\", \"nota\" ou \"caixa\". Se não achar, veja a aba \u003ca href=\"#suporte\">Suporte\u003c/a>.\u003c/div>'};\n  }\n\n  function homeHTML(filtro, busca, est){\n    var l = lista(est ? \"todos\" : filtro, est ? \"\" : busca);\n    return '\u003csection class=\"hero\">\u003ch1>'+esc(T.heroTitulo)+'\u003c/h1>\u003cp>'+esc(T.heroTexto)+'\u003c/p>'+\n      (est ? '' : '\u003cdiv class=\"search\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"m20 20-3.5-3.5\"/>\u003c/svg>\u003cinput id=\"q\" type=\"search\" placeholder=\"Ex.: impressora não imprime, contingência, spooler...\" aria-label=\"Buscar na central de ajuda\" value=\"'+esc(busca)+'\">\u003c/div>')+\n      '\u003cdiv class=\"quick\">Mais procurados: '+(T.destaques||[]).map(function(d){ return irBtn(d[1], esc(d[0]), est); }).join(\" \")+'\u003c/div>\u003c/section>'+\n      (est ? '' : '\u003cdiv class=\"filters\" role=\"group\" aria-label=\"Filtrar por sistema\" id=\"chips\">'+l.chips+'\u003c/div>')+\n      '\u003cdiv class=\"cats\" id=\"cats\">'+l.cards+'\u003c/div>';\n  }\n\n  function artigoHTML(a, est){\n    var cat = CATS.filter(function(c){ return c.id===a.cat; })[0] || {nome:\"\"};\n    var rel = ARTIGOS.filter(function(x){ return x.id!==a.id && (x.cat===a.cat || (a.sis!==\"geral\" && x.sis===a.sis)); }).slice(0,6);\n    var sups = supDe(a.sis);\n    return irBtn(\"inicio\", \"← Voltar para a central\", est, \"back\")+\n      '\u003cdiv class=\"article\">\u003carticle class=\"art\">'+tag(a.sis)+' \u003cspan class=\"tag\" style=\"--c:var(--muted)\">'+esc(cat.nome)+'\u003c/span>'+\n      '\u003ch1>'+esc(a.titulo)+'\u003c/h1>\u003cp class=\"lead\">'+a.lead+'\u003c/p>'+\n      a.corpo.map(function(b){ return bloco(b, est); }).join(\"\")+\n      '\u003cdiv class=\"fim\">\u003cp class=\"fim-q\">\u003cb>Seguiu todos os passos e não resolveu?\u003c/b>\u003c/p>\u003cp>Chame o suporte '+(sups.length>1?'no número do \u003cb>seu sistema\u003c/b>':'do \u003cb>'+esc(sisInfo(a.sis).nome)+'\u003c/b>')+':\u003c/p>'+\n      '\u003cdiv class=\"fim-cards\">'+sups.map(function(x){ return cardSup(x,false); }).join(\"\")+'\u003c/div>'+\n      '\u003cp class=\"fim-send\">Na mensagem, mande o nome da loja, uma foto do erro e diga que seguiu o artigo \u003cb>\"'+esc(a.titulo)+'\"\u003c/b>.\u003c/p>\u003c/div>\u003c/article>'+\n      '\u003caside class=\"aside\">'+(rel.length?'\u003ch4>Artigos relacionados\u003c/h4>\u003cul>'+rel.map(function(r){ return '\u003cli>\u003ca href=\"#'+esc(r.id)+'\">'+esc(r.titulo)+'\u003c/a>\u003c/li>'; }).join(\"\")+'\u003c/ul>':'')+'\u003c/aside>\u003c/div>';\n  }\n\n  function suporteHTML(est){\n    return '\u003csection class=\"suppage\">\u003ch1>Suporte\u003c/h1>\u003cp class=\"sp-lead\">A maioria dos problemas do caixa se resolve em poucos minutos com os artigos da central. Procure primeiro: é mais rápido do que esperar atendimento.\u003c/p>'+\n      '\u003cdiv class=\"sp-step\">\u003cspan class=\"sp-n\">1\u003c/span>\u003cdiv class=\"sp-body\">\u003ch2>Procure a solução\u003c/h2>'+\n      (est ? '' : '\u003cform class=\"search\" id=\"spForm\" role=\"search\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"m20 20-3.5-3.5\"/>\u003c/svg>\u003cinput id=\"spQ\" type=\"search\" placeholder=\"Descreva o problema. Ex.: impressora não imprime\" aria-label=\"Descreva o problema\">\u003c/form>')+\n      '\u003cp class=\"sp-small\">Os problemas mais comuns:\u003c/p>\u003cdiv class=\"quick\">'+(T.destaquesSuporte||[]).map(function(d){ return irBtn(d[1], esc(d[0]), est); }).join(\" \")+'\u003c/div>\u003c/div>\u003c/div>'+\n      '\u003cdiv class=\"sp-step\">\u003cspan class=\"sp-n\">2\u003c/span>\u003cdiv class=\"sp-body\">\u003ch2>Não resolveu? Chame no WhatsApp\u003c/h2>\u003cp class=\"sp-warn\">\u003cb>São dois números diferentes.\u003c/b> Escolha pelo sistema que você usa no caixa.\u003c/p>'+\n      '\u003cdiv class=\"sup-grid\">'+cardSup(SUP.geral,true)+cardSup(SUP.saurus,true)+'\u003c/div>\u003cp class=\"sp-small\">Não sabe qual é o seu sistema? Olhe o nome que aparece na tela do caixa ou no rodapé do cupom impresso.\u003c/p>\u003c/div>\u003c/div>'+\n      '\u003cdiv class=\"sp-step\">\u003cspan class=\"sp-n\">3\u003c/span>\u003cdiv class=\"sp-body\">\u003ch2>Mande na primeira mensagem\u003c/h2>\u003col class=\"sp-list\">\u003cli>O \u003cb>nome da loja\u003c/b> (ou o CNPJ).\u003c/li>\u003cli>O \u003cb>sistema\u003c/b> e em qual caixa o problema aparece.\u003c/li>\u003cli>Uma \u003cb>foto ou print da tela\u003c/b> com a mensagem de erro.\u003c/li>\u003cli>O que você \u003cb>já tentou\u003c/b>, por exemplo: \"segui o artigo do spooler e não resolveu\".\u003c/li>\u003c/ol>\u003c/div>\u003c/div>\u003c/section>';\n  }\n\n  /* Versão completa sem JavaScript: cada página é uma seção que aparece quando o endereço aponta para ela */\n  function estaticoHTML(){\n    var css = '\u003cstyle>.loading{display:none}.spg{display:none}.spg-home{display:block}.spg:target{display:block}#app:has(.spg:target) .spg-home{display:none}.quick a,a.back{display:inline-block;text-decoration:none}.quick a{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.88rem}.tabpanel{border-top:1px solid var(--line);padding-top:12px}\u003c/style>';\n    return css + '\u003csection class=\"spg spg-home\" id=\"inicio\">'+homeHTML(\"todos\",\"\",true)+'\u003c/section>' +\n      '\u003csection class=\"spg\" id=\"suporte\">'+suporteHTML(true)+'\u003c/section>' +\n      ARTIGOS.map(function(a){ return '\u003csection class=\"spg\" id=\"'+esc(a.id)+'\">'+artigoHTML(a,true)+'\u003c/section>'; }).join(\"\");\n  }\n\n  return {esc:esc, norm:norm, tag:tag, bloco:bloco, lista:lista, homeHTML:homeHTML, artigoHTML:artigoHTML, suporteHTML:suporteHTML, estaticoHTML:estaticoHTML, textoArtigo:textoArtigo};\n}\n","app":"/* Central de Ajuda: navegação e interação no navegador */\n(function(){\n  var D = JSON.parse(document.getElementById(\"dados\").textContent);\n  var C = criarCore(D);\n  var $ = function(s){ return document.querySelector(s); };\n  var app = $(\"#app\");\n  var filtro = \"todos\", busca = \"\", atual = \"\";\n  try { filtro = localStorage.getItem(\"filtro\") || \"todos\"; } catch(e){}\n  try { atual = location.hash.slice(1); } catch(e){}\n\n  function atualizarLista(){ var l = C.lista(filtro, busca); $(\"#chips\").innerHTML = l.chips; $(\"#cats\").innerHTML = l.cards; }\n  function renderHome(){\n    app.innerHTML = C.homeHTML(filtro, busca, false);\n    $(\"#q\").addEventListener(\"input\", function(e){ busca = e.target.value; atualizarLista(); });\n  }\n  function renderSuporte(){\n    app.innerHTML = C.suporteHTML(false);\n    $(\"#spForm\").addEventListener(\"submit\", function(e){ e.preventDefault(); busca = $(\"#spQ\").value; ir(\"inicio\"); });\n    window.scrollTo(0,0);\n  }\n  function marcaNav(id){ var s1=$(\"#navSup\"), s2=$(\"#navArt\"); var sup=(id===\"suporte\"); (sup?s1:s2).setAttribute(\"aria-current\",\"page\"); (sup?s2:s1).removeAttribute(\"aria-current\"); }\n  function rota(idArg){\n    var id = (typeof idArg === \"string\") ? idArg : atual;\n    atual = id; marcaNav(id);\n    if(id===\"suporte\"){ document.title = \"Suporte · \" + D.empresa.empresa; renderSuporte(); return; }\n    var a = D.artigos.filter(function(x){ return x.id===id; })[0];\n    if(a){ document.title = a.titulo + \" · \" + D.empresa.empresa; app.innerHTML = C.artigoHTML(a, false); window.scrollTo(0,0); }\n    else { document.title = D.empresa.nome + \" \" + D.empresa.empresa; renderHome(); }\n  }\n  function ir(id){\n    rota(id);\n    try { if(location.hash.slice(1)!==id) history.pushState(null, \"\", \"#\"+id); } catch(e){}\n  }\n  function toast(msg){ var t=$(\"#toast\"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ t.hidden=true; },1800); }\n\n  /* Links internos (#artigo) navegam pelo script: alguns visualizadores bloqueiam a troca de endereço */\n  document.addEventListener(\"click\", function(e){\n    var a = e.target.closest('a[href^=\"#\"]');\n    if(!a || e.defaultPrevented) return;\n    e.preventDefault();\n    if(a.id===\"brandLink\") busca = \"\";\n    ir(a.getAttribute(\"href\").slice(1) || \"inicio\");\n  }, true);\n  document.addEventListener(\"click\", function(e){\n    var go = e.target.closest(\"[data-go]\");\n    if(go){ e.preventDefault(); ir(go.getAttribute(\"data-go\")); return; }\n    var f = e.target.closest(\"[data-f]\");\n    if(f){ filtro = f.getAttribute(\"data-f\"); try{ localStorage.setItem(\"filtro\",filtro); }catch(err){} atualizarLista(); return; }\n    var tb = e.target.closest(\"[data-tab]\");\n    if(tb){ var k = tb.getAttribute(\"data-tab\"); document.querySelectorAll(\"[data-tab]\").forEach(function(x){ x.setAttribute(\"aria-selected\", x===tb); }); document.querySelectorAll(\"[data-panel]\").forEach(function(x){ x.hidden = x.getAttribute(\"data-panel\")!==k; }); return; }\n    var c = e.target.closest(\"[data-copy]\");\n    if(c){\n      var txt = decodeURIComponent(c.getAttribute(\"data-copy\"));\n      var fallback = function(){ var r=document.createRange(); r.selectNodeContents(c.previousElementSibling); var s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(\"Selecionado: aperte Ctrl+C\"); };\n      try{ navigator.clipboard.writeText(txt).then(function(){ c.textContent=\"Copiado\"; toast(\"Comando copiado\"); setTimeout(function(){ c.textContent=\"Copiar\"; },1500); }, fallback); }catch(err){ fallback(); }\n    }\n  });\n  var doEndereco = function(){ var h=\"\"; try{ h=location.hash.slice(1); }catch(e){} if(h!==atual) rota(h); };\n  window.addEventListener(\"hashchange\", doEndereco);\n  window.addEventListener(\"popstate\", doEndereco);\n  rota();\n})();\n"}</script>
<script id="dados-padrao" type="application/json">{"empresa":{"nome":"Central de Ajuda","empresa":"ARM Sistemas","suporte":{"geral":{"num":"(12) 98275-6550","wa":"5512982756550","sistemas":"PDV Legal, Pallas e Mentora","pergunta":"Usa PDV Legal, Pallas ou Mentora?","cor":"--sup1"},"saurus":{"num":"(11) 97415-1368","wa":"5511974151368","sistemas":"Saurus","pergunta":"Usa Saurus?","cor":"--sup2"}}},"sistemas":{"geral":{"nome":"Todos os sistemas","cor":"--geral"},"pallas":{"nome":"Pallas","cor":"--pallas"},"mentora":{"nome":"Mentora","cor":"--mentora"},"saurus":{"nome":"Saurus","cor":"--saurus"},"pdvlegal":{"nome":"PDV Legal","cor":"--pdvlegal"}},"cats":[{"id":"pdvlegal","nome":"PDV Legal","desc":"Impressoras, caixa, notas com erro, atualização, servidor local e vídeos."},{"id":"pallas","nome":"Pallas","desc":"Caixa, Pix, impressoras, cozinha, rejeições de NFC-e, Nuvem e vídeos."},{"id":"mentora","nome":"Mentora","desc":"Carga no PDV, modo offline, aplicativos e vídeos de ajuda."},{"id":"saurus","nome":"Saurus","desc":"Teclas de atalho, contingência, cozinha, equipamentos e vídeos de ajuda."},{"id":"produtos","nome":"Produtos e NCM","desc":"Cadastro de produto, NCM e tributação em cada sistema."},{"id":"impressoras","nome":"Impressoras","desc":"Cupom não sai, fila travada, impressora da cozinha e térmicas USB."},{"id":"fiscal","nome":"Fiscal e contingência","desc":"NFC-e em contingência, rejeições, certificado digital e SEFAZ."},{"id":"rede","nome":"Internet e rede","desc":"PDV sem internet, servidor não encontrado e firewall."},{"id":"windows","nome":"Windows no caixa","desc":"Prompt de comando, data e hora, reiniciar serviços."}],"guias":{"cont":{"pdvlegal":[{"p":"O PDV Legal entra em contingência sozinho quando a SEFAZ ou a internet cai, e tenta enviar as notas sozinho quando a conexão volta. Se alguma ficar pendente, faça assim:"},{"h":"1. Enviar as vendas presas no aparelho"},{"steps":["No PDV, abra \u003cb>Relatórios → Status de sincronização web\u003c/b>.","Marque \u003cb>Somente não enviadas\u003c/b> e toque em \u003cb>Sincronizar\u003c/b>.","Espere todas as vendas ficarem como \u003cb>Sincronizado\u003c/b>."]},{"h":"2. Conferir as notas no Painel"},{"steps":["Abra \u003cb>Vendas\u003c/b>, digite sua senha, toque em \u003cb>+Funções → Painel\u003c/b> (Painel de Documentos).","Procure a venda pelo horário e pelo valor e veja a cor do status.","\u003cb>Amarelo (não emitida):\u003c/b> abra a venda e confirme a emissão. Ou toque em \u003cb>Ações → Imprimir NFC-e\u003c/b>: o PDV reenvia e imprime.","\u003cb>Vermelho (rejeitada):\u003c/b> leia o motivo e veja \u003ca href=\"#pdvlegal-erro-fiscal\">Erro com documentos fiscais\u003c/a>."]},{"tip":"Apareceu \u003cb>Emissão em contingência bloqueada para o emitente\u003c/b>? A SEFAZ já voltou. Emita a nota de novo normalmente."},{"p":"Se a sua loja emite as notas pelo \u003cb>Cloud\u003c/b> (Gestão Legal), não existe contingência: sem internet, a venda fica guardada no aparelho e o Cloud emite a nota assim que a conexão volta."}],"pallas":[{"h":"Pallas Caixa (computador)"},{"p":"Nas versões atuais, o Pallas avisa sozinho quando há NFC-e pendente."},{"steps":["Com a internet de volta, abra o \u003cb>Pallas Caixa\u003c/b>.","No \u003cb>menu do caixa\u003c/b> aparece o aviso de \u003cb>NFC-e pendentes\u003c/b>.","Saia da tela de vendas para o menu: o Pallas pergunta se você quer \u003cb>reenviar as NFC-e pendentes\u003c/b>. Responda \u003cb>Sim\u003c/b>.","Espere terminar. O aviso some quando todas forem autorizadas."]},{"tip":"O aviso não aparece? A versão pode ser antiga (o aviso de pendentes veio na 4.7.9 e a pergunta de reenvio na 5.1.3). Chame o suporte para atualizar."},{"h":"Pallas PDV Mobile (maquininha, celular, tablet)"},{"steps":["Confira o Wi-Fi ou o chip de dados da maquininha.","No app, vá em \u003cb>Integração → Certificado A1 → Detalhes\u003c/b>.","Toque em \u003cb>LISTA DE NFCE\u003c/b>. A coluna de status mostra quais estão autorizadas e quais têm erro.","Abra a nota com erro e toque em \u003cb>VENDA\u003c/b>. Se o problema for no produto, toque no código dele para corrigir.","Toque em \u003cb>EMITIR NFCE\u003c/b>. Quando ficar verde com \u003cb>AUTORIZADO\u003c/b>, está resolvido."]},{"p":"No \u003cb>Pallas Kiosk\u003c/b> (totem), a nota em contingência é enviada sozinha depois de cada venda."},{"warn":"Se aparecer \u003cb>O acesso ao caminho C:\\ProgramData\\Pallas\\NFCe foi negado\u003c/b>, as notas não saem até corrigir. Veja \u003ca href=\"#pallas-acesso-negado\">este artigo\u003c/a>. Para códigos de rejeição, veja \u003ca href=\"#pallas-rejeicoes\">Rejeições mais comuns no Pallas\u003c/a>."}],"saurus":[{"h":"Na hora que a internet cair"},{"p":"Finalize a venda com \u003ckbd>F2\u003c/kbd> (finalização em contingência) em vez de \u003ckbd>F1\u003c/kbd>. O cupom sai em contingência e o caixa não para."},{"h":"Quando a internet voltar"},{"steps":["Na tela de vendas do Saurus PDV, aperte \u003ckbd>C\u003c/kbd>. Abre a \u003cb>tela de contingência da NFC-e\u003c/b>.","Selecione as notas da lista.","Clique em \u003cb>Transmitir Selecionadas\u003c/b>.","Confira se todas mudaram para autorizadas."]},{"tip":"Voltou \u003cb>rejeição por duplicidade\u003c/b> ou a nota não sai da lista? Use o atalho com \u003ccode>forcarautorizacao=true\u003c/code>: veja \u003ca href=\"#saurus-forcar\">Forçar autorização no Saurus\u003c/a>."},{"warn":"Rejeição de cadastro (NCM, imposto, CSC) precisa ser corrigida antes de transmitir. Mande o print para o suporte."}],"mentora":[{"p":"O PDV do Mentora trabalha on-line e off-line e envia as vendas sozinho quando a internet volta. A Mentora não publica manual aberto desta tela, então os nomes dos botões podem variar na sua versão."},{"steps":["Com a internet de volta, deixe o PDV \u003cb>aberto\u003c/b> por alguns minutos para ele sincronizar.","No PDV, abra a consulta de vendas / notas emitidas e procure as que estão como \u003cb>contingência\u003c/b>, \u003cb>off-line\u003c/b> ou \u003cb>não transmitidas\u003c/b>.","Selecione e use a opção de \u003cb>reenviar / transmitir\u003c/b>.","No ERP (retaguarda web), confira se as vendas e as notas apareceram."]},{"warn":"Se as notas continuarem pendentes, chame nosso suporte e não feche o caixa, não formate e não desinstale o PDV: as vendas off-line ficam guardadas só naquele computador."}]},"prod":{"pdvlegal":[{"p":"O cadastro é feito no \u003cb>Retaguarda Cloud\u003c/b> (no computador ou celular) e depois enviado para o PDV."},{"steps":["Acesse \u003cb>Produtos → Produtos\u003c/b> e clique em \u003cb>Novo\u003c/b>.","Se o produto tem código de barras, digite no campo de consulta do topo. O sistema sugere descrição, NCM e CEST. Confira, principalmente se a confiança não for máxima.","Preencha \u003cb>Nome do produto\u003c/b>, \u003cb>Grupo\u003c/b> e \u003cb>Unidade de venda\u003c/b>.","Preencha \u003cb>Código NCM\u003c/b> e \u003cb>Código CEST\u003c/b> (veja a aba NCM deste guia).","Em \u003cb>Depois de gravar eu quero\u003c/b>, escolha \u003cb>Ver o cadastro completo\u003c/b> e clique em \u003cb>Gravar\u003c/b>.","Na aba \u003cb>Preços, impostos e modificadores\u003c/b>: digite o \u003cb>valor de venda\u003c/b>, marque onde vende (\u003cb>balcão\u003c/b>, \u003cb>mesa\u003c/b>, \u003cb>delivery\u003c/b>) e escolha o \u003cb>Grupo Tributário\u003c/b>.","Na aba \u003cb>Configurações\u003c/b>, produto sem código de barras fica com \u003cb>SEM GTIN\u003c/b>.","Grave."]},{"h":"Mandar para o caixa"},{"steps":["No PDV, abra o \u003cb>Menu principal\u003c/b> → \u003cb>Mais\u003c/b> (canto superior direito) → \u003cb>Sinc. Tabelas\u003c/b>."]},{"tip":"O Grupo Tributário é criado uma vez em \u003cb>Administrativo → Filiais → Grupo de Tributos\u003c/b>, com as regras que o contador passar. Depois é só escolher no produto."},{"h":"Vídeos"},{"videos":[["Modificadores: personalizar pedidos","https://www.youtube.com/watch?v=hN-h7c5RWPU"],["Entrada de estoque e fator de conversão","https://www.youtube.com/watch?v=djjwR01Dzz0"]]}],"pallas":[{"h":"Pela Nuvem (app.sistemapallas.com.br)"},{"steps":["Acesse \u003cb>Cardápio Digital → Produtos → Novo\u003c/b>.","Na aba \u003cb>Dados do produto\u003c/b>: \u003cb>Nome\u003c/b>, \u003cb>Preço de custo\u003c/b> e \u003cb>Margem de lucro\u003c/b> (o sistema calcula o preço de venda), \u003cb>Grupo\u003c/b>, \u003cb>Unidade\u003c/b> (Unitário ou KG), \u003cb>Imposto\u003c/b>, \u003cb>NCM\u003c/b> e \u003cb>CEST\u003c/b>.","Em \u003cb>Código do produto\u003c/b>, clique no \u003cb>+\u003c/b> para o sistema gerar o código.","Se vende no cardápio digital, preencha a aba \u003cb>APP DELIVERY\u003c/b> (nome para o cliente, preço, detalhes e horários).","Clique em \u003cb>SALVAR\u003c/b> (e publique o cardápio, se usar)."]},{"h":"Pelo Retaguarda Windows"},{"steps":["No Retaguarda, vá em \u003cb>Produtos → Produtos Específicos\u003c/b> e inclua um produto novo.","Preencha descrição, grupo, unidade, preço, código de barras, \u003cb>NCM\u003c/b>, \u003cb>CEST\u003c/b> e imposto.","Se o produto vai para a cozinha ou bar, escolha a \u003cb>impressora de produção\u003c/b>.","Clique em \u003cb>Gravar\u003c/b> e reinicie o \u003cb>Pallas Caixa\u003c/b>."]},{"p":"Passo a passo completo, com estoque, grade e importação por planilha: \u003ca href=\"#pallas-produto-retaguarda\">Cadastrar produto no Retaguarda Windows\u003c/a>."},{"tip":"Vai cadastrar muitos produtos? O Pallas importa planilha. Chame o suporte que a gente ajuda a montar."},{"videos":[["Cadastro de produto no Pallas","https://www.youtube.com/watch?v=9KrV9CE9j10"],["Cardápio Digital: configuração completa","https://www.youtube.com/watch?v=2T0riJY5mq0"]]}],"saurus":[{"steps":["No Saurus PDV, abra \u003cb>Cadastro de Produtos\u003c/b> (tecla \u003ckbd>F4\u003c/kbd>) e clique em \u003cb>Adicionar Produto\u003c/b>.","\u003cb>Código:\u003c/b> o código de barras (EAN) ou um código interno.","\u003cb>Descrição\u003c/b> e \u003cb>valor de venda\u003c/b>.","\u003cb>Medida de venda\u003c/b> (unidade).","\u003cb>NCM\u003c/b> (veja a aba NCM deste guia).","\u003cb>Impostos:\u003c/b> escolha conforme o contador orientou.","Clique em \u003cb>Salvar e Adicionar Novo\u003c/b> (cadastro rápido) ou \u003cb>Salvar e Editar\u003c/b> (para completar)."]},{"h":"No cadastro completo"},{"steps":["\u003cb>Informações de Venda:\u003c/b> valor de compra e venda (a margem é calculada sozinha). O lápis ao lado ajusta o estoque.","\u003cb>Classificação → Balança:\u003c/b> pesável, pesado na venda ou unitário. Se não for de balança, \u003cb>NÃO APLICÁVEL\u003c/b>.","\u003cb>Códigos:\u003c/b> um produto pode ter mais de um código de barras."]}],"mentora":[{"p":"O cadastro é feito no \u003cb>ERP do Mentora\u003c/b> (sistema web) e depois enviado para o PDV pela carga. A Mentora não publica manual aberto, então os nomes podem variar um pouco na sua versão."},{"h":"Vídeos da Mentora"},{"videos":[["Cadastro de produtos automatizado","https://www.youtube.com/watch?v=QVizpQ19aIc"],["Cadastro de produtos no PDV Mobile","https://www.youtube.com/watch?v=R0qc7_yPKvs"]]},{"steps":["No ERP, abra o cadastro de \u003cb>Produtos\u003c/b> e clique para incluir um novo.","Preencha descrição, código de barras, unidade, preço de venda, NCM, CEST e a tributação passada pelo contador.","Se quiser o produto na tela de favoritos do caixa, marque \u003cb>Exibe lista no PDV\u003c/b>.","Salve.","No PDV, faça a \u003cb>carga\u003c/b> para o produto aparecer. Veja \u003ca href=\"#mentora-carga\">Produto não aparece no PDV\u003c/a>."]}]},"ncm":{"pdvlegal":[{"steps":["No Retaguarda Cloud, abra o produto em \u003cb>Produtos → Produtos\u003c/b>.","Na aba \u003cb>Preços, impostos e modificadores\u003c/b>, corrija o \u003cb>Código NCM\u003c/b> e, se tiver, o \u003cb>Código CEST\u003c/b>.","Confira o \u003cb>Grupo Tributário\u003c/b>.","Grave e faça \u003cb>Sinc. Tabelas\u003c/b> no PDV.","Se a nota tinha voltado rejeitada, reenvie pelo Painel (veja \u003ca href=\"#pdvlegal-erro-fiscal\">Erro com documentos fiscais\u003c/a>)."]},{"tip":"Para conferir tudo de uma vez, o Retaguarda tem o \u003cb>Relatório de impostos de produtos\u003c/b>, que mostra NCM e tributação de cada item."}],"pallas":[{"steps":["Abra o produto (na Nuvem: \u003cb>Cardápio Digital → Produtos\u003c/b>; no Windows: \u003cb>Produtos\u003c/b> no Retaguarda).","Corrija o campo \u003cb>NCM\u003c/b> (e o \u003cb>CEST\u003c/b>, se tiver).","Salve e reenvie as notas que tinham voltado com \u003cb>Rejeição 778\u003c/b> (NCM inexistente)."]},{"h":"O NCM certo não aparece na lista? (Retaguarda Windows)"},{"p":"A tabela de NCM do Pallas precisa ser atualizada de tempos em tempos. Peça ao suporte a planilha do seu estado e carregue em \u003cb>Retaguarda → Utilitários → Carregar tabela de NCM\u003c/b>."}],"saurus":[{"steps":["Abra o Saurus PDV e entre na \u003cb>Central Administrativa\u003c/b>.","Clique em \u003cb>N.C.M\u003c/b> (tecla \u003ckbd>F3\u003c/kbd>).","Para cadastrar um novo: \u003cb>Adicionar NCM\u003c/b> → digite o \u003cb>Código\u003c/b> → clique na lupa ao lado. O sistema preenche as alíquotas e o CEST.","Clique em \u003cb>Salvar\u003c/b>.","Depois, abra o produto (\u003ckbd>F4\u003c/kbd>) e escolha o NCM certo."]},{"h":"Atualizar a tabela de impostos (IBPT)"},{"steps":["Na tela de N.C.M, clique em \u003cb>Integração Fiscal\u003c/b> (lado direito).","Marque o que quer atualizar e clique em \u003cb>Confirmar e Atualizar\u003c/b>."]},{"warn":"O Saurus vem com o NCM \u003cb>99999999\u003c/b> de exemplo. Ele não serve para emitir nota: troque pelos NCMs reais dos produtos."}],"mentora":[{"steps":["No ERP, abra o produto e corrija o campo \u003cb>NCM\u003c/b> (e o \u003cb>CEST\u003c/b>, se tiver).","Salve e faça a \u003cb>carga\u003c/b> no PDV.","Reenvie as notas que tinham voltado rejeitadas."]}]},"cert":{"pdvlegal":[{"p":"No PDV Legal o certificado fica na nuvem, no cadastro da filial. Não precisa instalar no computador do caixa."},{"steps":["No Retaguarda Cloud, vá em \u003cb>Administrativo → Filiais\u003c/b> e edite a filial.","Abra a aba \u003cb>Fiscal\u003c/b>.","Confira o \u003cb>CSC\u003c/b> (ID e Token).","Anexe o certificado \u003cb>A1\u003c/b>: um apelido qualquer, a \u003cb>senha\u003c/b> e o arquivo \u003cb>.pfx\u003c/b> (ou .p12).","Salve."]},{"h":"Certificado renovado"},{"steps":["Em \u003cb>Administrativo → Filiais\u003c/b>, certificado vencido aparece em \u003cb>vermelho\u003c/b> e o que vence em até 30 dias, em \u003cb>amarelo\u003c/b>.","Depois de anexar o certificado novo, clique no \u003cb>botão verde com duas setas\u003c/b> para atualizar a data."]},{"warn":"Com o certificado vencido, o PDV Legal \u003cb>bloqueia a tela de vendas\u003c/b>. Renove pelo menos 15 dias antes."},{"tip":"Erro ao validar? Confira a senha e se o certificado é do \u003cb>CNPJ\u003c/b> da loja. Certificado só no CPF do dono não funciona."}],"pallas":[{"h":"Pallas Caixa (computador)"},{"steps":["Instale o certificado no Windows do caixa (veja \u003ca href=\"#cert-windows\">Instalar certificado A1 no Windows\u003c/a>).","No Retaguarda, aperte \u003ckbd>F12\u003c/kbd> e vá na aba \u003cb>Caixa → NFCe\u003c/b>.","No campo do certificado, escolha o certificado da loja.","Digite a \u003cb>senha do certificado\u003c/b>, o \u003cb>CSC ID\u003c/b> e o \u003cb>CSC\u003c/b> (o contador informa).","Clique em \u003cb>Gravar\u003c/b> e reinicie o \u003cb>Pallas Caixa\u003c/b>."]},{"h":"Pallas Nuvem e PDV Mobile"},{"steps":["Na Nuvem, clique no \u003cb>ícone do seu perfil\u003c/b> → \u003cb>Integrações\u003c/b>.","Abra \u003cb>Certificado Digital → Detalhes\u003c/b>.","Arraste o arquivo \u003cb>.PFX\u003c/b> para a janela (ou procure no computador).","Digite a senha e clique em \u003cb>Instalar\u003c/b>."]},{"tip":"Deu \u003cb>Erro ao salvar o Certificado Digital\u003c/b> na Nuvem? O arquivo precisa ser reexportado pelo Windows com outra criptografia. Chame o suporte que fazemos por acesso remoto."}],"saurus":[{"p":"No Saurus o certificado fica instalado no Windows e o PDV encontra ele pelo \u003cb>número de série\u003c/b>."},{"steps":["Instale o certificado no Windows do caixa (veja \u003ca href=\"#cert-windows\">Instalar certificado A1 no Windows\u003c/a>).","Copie o \u003cb>número de série\u003c/b> do certificado (o mesmo artigo ensina).","No Saurus PDV, abra a \u003cb>Empresa\u003c/b> (tecla \u003ckbd>F6\u003c/kbd>) → \u003cb>Configurações → Sistema\u003c/b>.","Cole em \u003cb>NUMERO DE SERIE DO CERTIFICADO DIGITAL\u003c/b>.","Confira o \u003cb>ID\u003c/b> e o \u003cb>CSC\u003c/b> da NFC-e e salve."]},{"warn":"Renovou o certificado? O número de série \u003cb>muda\u003c/b>. Se não trocar no Saurus, as notas param de sair."}],"mentora":[{"p":"No Mentora o certificado é enviado no cadastro da empresa, no ERP web. A Mentora não publica manual aberto desta tela."},{"steps":["Tenha em mãos o arquivo \u003cb>.pfx\u003c/b> do certificado A1 e a senha.","No ERP, abra o cadastro da empresa / configurações fiscais e procure a opção de certificado digital.","Envie o arquivo, digite a senha e salve.","Faça uma venda de teste e veja se a nota é autorizada."]},{"tip":"Se não encontrar a opção, mande o arquivo e a senha para o nosso suporte por um canal seguro e a gente instala."},{"h":"Vídeos: baixar o certificado na certificadora"},{"videos":[["Baixar e instalar certificado Certisign","https://www.youtube.com/watch?v=QiBJuH90nC0"],["Baixar certificado digital da Syngular","https://www.youtube.com/watch?v=lN1JYnbskQA"],["Baixar certificado digital Soluti","https://www.youtube.com/watch?v=VbBu2OuCkeg"],["Testar certificado digital A3","https://www.youtube.com/watch?v=Sir0qcEkp2c"]]}]}},"artigos":[{"id":"spooler","cat":"impressoras","sis":"geral","titulo":"Impressora parou de imprimir: reiniciar o spooler","lead":"Resolve a maioria dos casos em que o sistema manda imprimir e nada sai, ou a impressora aparece como \"Erro\" ou \"Offline\" no Windows.","tags":"net stop spooler net start spooler fila travada não imprime erro impressão","corpo":[{"h":"Antes de tudo"},{"steps":["Confira se a impressora está ligada, com papel e com a tampa bem fechada.","Desligue a impressora da tomada por 10 segundos e ligue de novo.","Se continuar sem imprimir, siga os passos abaixo."]},{"h":"Passo 1: abrir o Prompt de Comando como administrador"},{"p":"O comando do spooler só funciona com permissão de administrador. Se abrir o Prompt do jeito normal, vai aparecer \u003cb>Acesso negado\u003c/b>."},{"steps":["Feche o sistema do caixa (Pallas, Mentora, Saurus ou PDV Legal).","Clique no botão \u003cb>Iniciar\u003c/b> do Windows (o ícone do Windows no canto da barra de tarefas) ou aperte a tecla \u003ckbd>Win\u003c/kbd> no teclado.","Sem clicar em nada, digite \u003cb>cmd\u003c/b>. A busca abre sozinha e mostra \u003cb>Prompt de Comando\u003c/b> no topo.","Clique com o \u003cb>botão direito\u003c/b> do mouse em \u003cb>Prompt de Comando\u003c/b> e escolha \u003cb>Executar como administrador\u003c/b>. No Windows 11 essa opção também aparece direto no painel da direita."]},{"fig":"menu"},{"steps":["O Windows pergunta: \u003ci>Deseja permitir que este aplicativo faça alterações no seu dispositivo?\u003c/i> Clique em \u003cb>Sim\u003c/b>. Se pedir senha, digite a senha do usuário administrador do computador.","Abre uma janela preta. Olhe o título no topo: ele precisa começar com \u003cb>Administrador:\u003c/b>. Se não tiver essa palavra, feche e repita o passo 4."]},{"fig":"janela"},{"tip":"Atalho rápido: aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite \u003cb>cmd\u003c/b> e aperte \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Shift\u003c/kbd> + \u003ckbd>Enter\u003c/kbd>. Ele já abre como administrador."},{"h":"Passo 2: parar e ligar o spooler"},{"steps":["Clique dentro da janela preta, digite o comando abaixo (ou use o botão Copiar e cole com o botão direito do mouse) e aperte \u003ckbd>Enter\u003c/kbd>:"]},{"cmd":"net stop spooler"},{"p":"A mensagem deve ser: \u003ci>O serviço de Spooler de impressão foi interrompido com êxito\u003c/i>. Agora ligue o serviço de novo:"},{"cmd":"net start spooler"},{"steps":["Feche a janela preta, abra o sistema e faça uma impressão de teste (reimprimir o último cupom, por exemplo)."]},{"warn":"Se aparecer \u003cb>Acesso negado\u003c/b>, o Prompt não foi aberto como administrador. Feche e abra de novo pelo botão direito → Executar como administrador."},{"tip":"Se o spooler parar sozinho várias vezes no dia, a fila pode ter um arquivo corrompido. Veja o artigo \u003ca href=\"#limpar-fila\">Limpar a fila de impressão travada\u003c/a>."}]},{"id":"limpar-fila","cat":"impressoras","sis":"geral","titulo":"Limpar a fila de impressão travada","lead":"Quando um cupom fica preso na fila, ele trava todos os que vêm depois. Este procedimento apaga a fila inteira.","tags":"fila spooler printers travada documento preso excluir","corpo":[{"p":"Abra o \u003cb>Prompt de Comando como administrador\u003c/b> e rode os três comandos, um de cada vez:"},{"cmd":"net stop spooler"},{"cmd":"del /Q /F %systemroot%\\System32\\spool\\PRINTERS\\*"},{"cmd":"net start spooler"},{"warn":"Os documentos que estavam na fila serão perdidos. Se era um cupom fiscal, reimprima pelo sistema depois (a nota continua válida; só a impressão é refeita)."},{"h":"Fazer tudo de uma vez"},{"p":"Você pode colar esta linha única no Prompt de administrador:"},{"cmd":"net stop spooler && del /Q /F %systemroot%\\System32\\spool\\PRINTERS\\* && net start spooler"}]},{"id":"termica-usb","cat":"impressoras","sis":"geral","titulo":"Impressora térmica USB não é reconhecida","lead":"Para impressoras de cupom (Elgin, Bematech, Epson, Daruma, Tanca e similares) ligadas por cabo USB.","tags":"usb driver elgin bematech epson daruma tanca térmica não reconhece porta","corpo":[{"steps":["Troque o cabo USB de porta, de preferência direto no computador (evite hubs e extensões).","Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite \u003ccode>control printers\u003c/code> e dê \u003ckbd>Enter\u003c/kbd>. A impressora deve aparecer na lista.","Se aparecer com ícone de alerta, clique com o botão direito → \u003cb>Propriedades da impressora\u003c/b> → \u003cb>Imprimir página de teste\u003c/b>.","Se a página de teste não sair, reinstale o driver do fabricante (o mesmo modelo que está na etiqueta embaixo da impressora).","Confira o \u003cb>nome\u003c/b> da impressora no Windows. O nome configurado no sistema do caixa precisa ser exatamente igual. Se alguém renomeou a impressora, o sistema deixa de achá-la."]},{"cmd":"control printers"},{"tip":"Para descobrir se o problema é a impressora ou o computador: desligue a impressora, segure o botão FEED e ligue. Ela imprime uma página de autoteste. Se sair, a impressora está boa."}]},{"id":"impressora-rede","cat":"impressoras","sis":"geral","titulo":"Impressora de rede (cozinha/bar) não imprime","lead":"Para impressoras ligadas por cabo de rede, muito usadas na produção de restaurantes.","tags":"rede ip cozinha bar produção ping 9100 ethernet","corpo":[{"h":"1. Descubra o IP da impressora"},{"p":"O IP é o \"endereço\" da impressora na rede, algo como \u003cb>192.168.0.200\u003c/b>. Escolha um dos jeitos abaixo. O primeiro é o mais fácil."},{"h":"Jeito A: imprimir a página de autoteste"},{"steps":["Desligue a impressora no botão.","Segure o botão \u003cb>FEED\u003c/b> (avanço de papel) e, sem soltar, ligue a impressora.","Solte o botão quando ela começar a imprimir. Sai uma tira longa com as configurações.","Procure a linha \u003cb>IP Address\u003c/b> (ou \u003cb>Endereço IP\u003c/b>). Esse é o número que você precisa."]},{"fig":"autoteste"},{"tip":"Em alguns modelos de rede, a página com o IP sai apertando por 3 a 5 segundos o botãozinho na parte de trás, perto do cabo de rede (às vezes chamado de \u003cb>Status\u003c/b> ou \u003cb>Reset\u003c/b>). Aperte rápido, sem segurar demais: segurar por muito tempo pode apagar a configuração de rede."},{"h":"Jeito B: ver no Windows"},{"p":"Se a impressora já funcionava neste computador, o Windows guarda o IP dela."},{"steps":["Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite o comando abaixo e aperte \u003ckbd>Enter\u003c/kbd>:"]},{"cmd":"control printers"},{"steps":["Clique com o botão direito na impressora da cozinha → \u003cb>Propriedades da impressora\u003c/b>.","Abra a aba \u003cb>Portas\u003c/b>.","A porta marcada mostra o IP (ex.: \u003cb>IP_192.168.0.200\u003c/b> ou \u003cb>192.168.0.200\u003c/b>)."]},{"p":"Ou veja todas de uma vez: abra o Prompt de Comando e rode o comando abaixo. Ele lista o nome de cada impressora e a porta/IP dela."},{"cmd":"powershell -command \"Get-Printer | Format-Table Name,PortName -AutoSize\""},{"tip":"No \u003cb>PDV Legal\u003c/b> tem um atalho: \u003cb>Configurar → Lista de dispositivos na rede\u003c/b>. Procure o IP que aparece com o modelo da impressora."},{"h":"Jeito C: ver no sistema do caixa"},{"p":"No Pallas, Mentora, Saurus ou PDV Legal, a tela de configuração das impressoras de produção mostra o IP que o sistema está usando. Compare com o IP da página de autoteste: se forem diferentes, achou o problema."},{"h":"2. Teste se o computador enxerga a impressora"},{"p":"No Prompt de Comando, troque o IP pelo da sua impressora:"},{"cmd":"ping 192.168.0.200"},{"steps":["Se aparecer \u003cb>Resposta de 192.168.0.200\u003c/b>: a rede está ok. Reinicie o spooler e teste de novo.","Se aparecer \u003cb>Esgotado o tempo limite\u003c/b> ou \u003cb>Host de destino inacessível\u003c/b>: confira o cabo de rede, as luzes do roteador/switch e se a impressora não mudou de IP."]},{"h":"3. A impressora mudou de IP?"},{"p":"Isso acontece quando o roteador foi trocado ou reiniciado e a impressora pega um IP automático novo. O sistema continua mandando para o IP antigo."},{"warn":"Peça ao suporte para fixar o IP da impressora. Assim o problema não volta na próxima queda de energia."}]},{"id":"cupom-cortado","cat":"impressoras","sis":"geral","titulo":"Cupom sai cortado, torto ou com caracteres estranhos","lead":"Geralmente é configuração de largura do papel ou modelo errado selecionado no sistema.","tags":"cortado 80mm 58mm caracteres estranhos símbolos largura bobina escpos","corpo":[{"steps":["Meça a bobina: as mais comuns são de \u003cb>80 mm\u003c/b> ou \u003cb>58 mm\u003c/b>.","No sistema do caixa, confira se a largura do papel e o modelo da impressora estão iguais ao equipamento.","Se saírem símbolos sem sentido, o modelo/protocolo está errado (por exemplo, escolhido Bematech para uma impressora Elgin).","Em impressoras com DIP switch ou utilitário do fabricante, confira se o modo de emulação é ESC/POS."]},{"tip":"Bobina com impressão fraca ou apagada costuma ser papel virado ao contrário. O lado térmico é o de fora do rolo: risque com a unha, o lado que escurece é o certo."}]},{"id":"contingencia-o-que-e","cat":"fiscal","sis":"geral","titulo":"O que é NFC-e em contingência","lead":"Quando a internet ou a SEFAZ cai, o sistema emite a nota off-line para o caixa não parar. Depois essas notas precisam ser transmitidas.","tags":"contingência offline sefaz caiu tpEmis 9 nfce","corpo":[{"p":"Na contingência off-line, o sistema gera a NFC-e no próprio computador e imprime o cupom com a mensagem \u003cb>EMITIDA EM CONTINGÊNCIA\u003c/b>. A venda é válida, mas a nota ainda \u003cb>não foi autorizada\u003c/b> pela SEFAZ."},{"p":"Assim que a internet volta, essas notas precisam ser enviadas. A maioria dos sistemas faz isso sozinho, mas às vezes elas ficam presas e precisam ser enviadas manualmente."},{"warn":"Notas em contingência têm prazo para serem transmitidas, que varia por estado (em geral, até 24 horas depois de a comunicação voltar). Nota não transmitida vira problema fiscal. Não deixe acumular."},{"h":"Como subir as notas"},{"p":"Veja o passo a passo do seu sistema no guia \u003ca href=\"#subir-contingencia\">Como subir as notas em contingência\u003c/a>."},{"h":"Como saber se tenho notas pendentes"},{"steps":["O cupom impresso mostra a frase de contingência.","PDV Legal: venda amarela no Painel. Pallas: aviso de NFC-e pendentes no menu do caixa. Saurus: notas na tela da tecla \u003ckbd>C\u003c/kbd>."]},{"tip":"Contingência não é para uso no dia a dia. Se o caixa entra em contingência toda hora, o problema é a internet ou o certificado. Fale com o suporte."}]},{"id":"contingencia-pallas","cat":"fiscal","sis":"pallas","titulo":"Enviar notas em contingência no Pallas","lead":"Como transmitir as NFC-e pendentes no Pallas Caixa e no Pallas PDV Mobile.","tags":"pallas contingência enviar transmitir nfce pendente reenviar lista de nfce","corpo":[{"p":"Antes, confira a \u003ca href=\"#subir-contingencia\">lista de verificação\u003c/a>: internet, data e hora e certificado."},{"guia":["cont","pallas"]}]},{"id":"contingencia-mentora","cat":"fiscal","sis":"mentora","titulo":"Enviar notas em contingência no Mentora","lead":"Como conferir e reenviar as notas que ficaram off-line no PDV do Mentora.","tags":"mentora contingência offline sincronizar enviar nfce","corpo":[{"guia":["cont","mentora"]}]},{"id":"contingencia-saurus","cat":"fiscal","sis":"saurus","titulo":"Enviar notas em contingência no Saurus","lead":"Tecla F2 para vender sem internet e tecla C para transmitir depois.","tags":"saurus contingência enviar transmitir nfce pendente f2 tecla c transmitir selecionadas","corpo":[{"guia":["cont","saurus"]}]},{"id":"contingencia-pdvlegal","cat":"fiscal","sis":"pdvlegal","titulo":"Enviar notas em contingência no PDV Legal","lead":"Como sincronizar as vendas e reenviar as NFC-e que ficaram pendentes no PDV Legal.","tags":"pdv legal contingência enviar transmitir nfce pendente sincronizar painel","corpo":[{"guia":["cont","pdvlegal"]}]},{"id":"subir-contingencia","cat":"fiscal","sis":"geral","titulo":"Como subir as notas em contingência (todos os sistemas)","lead":"A internet ou a SEFAZ voltou e ficaram notas em contingência? Escolha o seu sistema abaixo. Cada um envia de um jeito.","tags":"subir contingência enviar transmitir notas pendentes nfce todos sistemas pdv legal pallas saurus mentora","corpo":[{"h":"Antes de tudo, nos quatro sistemas"},{"steps":["\u003cb>Internet de volta:\u003c/b> abra um site qualquer no navegador. Sem internet, nada sobe.","\u003cb>Data e hora certas:\u003c/b> é a causa número 1 de rejeição em nota de contingência. Veja \u003ca href=\"#data-hora\">Acertar data e hora\u003c/a>.","\u003cb>Certificado válido:\u003c/b> se venceu, nenhuma nota sobe. Veja \u003ca href=\"#certificado\">Certificado digital\u003c/a>."]},{"warn":"Suba as notas no mesmo dia. O prazo depende do estado, mas em geral é de até 24 horas depois que a conexão volta."},{"h":"Agora, no seu sistema"},{"tabs":[["PDV Legal","pdvlegal"],["Pallas","pallas"],["Saurus","saurus"],["Mentora","mentora"]]},{"tip":"Nota voltou com rejeição? Não cancele nem refaça a venda. Tire uma foto do código e da mensagem e mande para o suporte."}]},{"id":"data-hora","cat":"windows","sis":"geral","titulo":"Acertar data e hora do computador","lead":"Data ou hora errada é uma das causas mais comuns de rejeição de NFC-e, principalmente em notas de contingência.","tags":"data hora relógio fuso horário rejeição w32tm sincronizar","corpo":[{"steps":["Clique com o botão direito no relógio (canto inferior direito) → \u003cb>Ajustar data e hora\u003c/b>.","Ligue \u003cb>Definir horário automaticamente\u003c/b> e \u003cb>Definir fuso horário automaticamente\u003c/b>.","Confira se o fuso é \u003cb>(UTC-03:00) Brasília\u003c/b> ou o do seu estado.","Clique em \u003cb>Sincronizar agora\u003c/b>."]},{"p":"Se preferir pelo Prompt de Comando (como administrador):"},{"cmd":"net start w32time"},{"cmd":"w32tm /resync /force"},{"tip":"Se o relógio atrasa toda vez que o computador é desligado, a bateria da placa-mãe pode estar fraca. Avise o suporte."}]},{"id":"certificado","cat":"fiscal","sis":"geral","titulo":"Certificado digital vencido ou não encontrado","lead":"Sem certificado válido o sistema não consegue emitir nem transmitir notas.","tags":"certificado digital a1 a3 vencido expirado não encontrado certmgr","corpo":[{"h":"Conferir a validade"},{"p":"Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite o comando abaixo e dê \u003ckbd>Enter\u003c/kbd>:"},{"cmd":"certmgr.msc"},{"steps":["Abra \u003cb>Pessoal\u003c/b> → \u003cb>Certificados\u003c/b>.","Procure o certificado com o nome da empresa e o CNPJ.","Veja a coluna \u003cb>Data de Validade\u003c/b>."]},{"h":"Certificado A3 (token ou cartão)"},{"steps":["Confira se o token está bem encaixado na porta USB.","Tire e coloque de novo, e aguarde a luz piscar.","Teste outra porta USB."]},{"warn":"Certificado vencido não tem conserto: precisa ser renovado. Depois de renovar, veja \u003ca href=\"#certificado-sistema\">Como colocar o certificado digital no sistema\u003c/a>."}]},{"id":"rejeicao","cat":"fiscal","sis":"geral","titulo":"Nota rejeitada: o que fazer","lead":"Uma rejeição significa que a SEFAZ recusou a nota por algum dado errado. A nota não vale até ser corrigida.","tags":"rejeição rejeitada código sefaz ncm cfop erro nota","corpo":[{"steps":["Anote ou fotografe o \u003cb>código\u003c/b> e a \u003cb>mensagem\u003c/b> da rejeição.","Rejeição por data/hora: acerte o relógio (\u003ca href=\"#data-hora\">veja como\u003c/a>) e reenvie.","Rejeição por certificado: veja \u003ca href=\"#certificado\">Certificado digital\u003c/a>.","Rejeições de produto (NCM, CFOP, tributação): precisam de correção no cadastro do produto. Chame o suporte com o print."]},{"warn":"Não cancele, inutilize nem refaça a venda sem orientação. Isso pode gerar nota duplicada ou salto de numeração."}]},{"id":"sem-internet","cat":"rede","sis":"geral","titulo":"Caixa sem internet ou SEFAZ não responde","lead":"Testes rápidos para descobrir se o problema é o computador, a internet da loja ou a SEFAZ.","tags":"internet sem conexão ping dns sefaz fora do ar ipconfig flushdns","corpo":[{"h":"1. Teste a internet"},{"cmd":"ping 8.8.8.8"},{"p":"Se responder, a internet está chegando. Se der tempo esgotado, o problema é o cabo, o Wi-Fi ou o roteador: reinicie o roteador (tire da tomada por 30 segundos)."},{"h":"2. Limpe o DNS"},{"p":"Se o ping responde mas os sites não abrem, rode no Prompt de Comando:"},{"cmd":"ipconfig /flushdns"},{"h":"3. A SEFAZ está fora do ar?"},{"p":"Às vezes o problema é da própria SEFAZ do seu estado. Nesse caso o sistema entra em contingência sozinho e você continua vendendo. Depois, transmita as notas (veja \u003ca href=\"#contingencia-o-que-e\">contingência\u003c/a>)."}]},{"id":"servidor","cat":"rede","sis":"geral","titulo":"Caixa não conecta no servidor / banco de dados","lead":"Para lojas com mais de um computador, onde os caixas buscam os dados de um computador principal.","tags":"servidor banco de dados conexão firewall rede caixa 2 terminal","corpo":[{"steps":["Confira se o computador servidor está \u003cb>ligado\u003c/b> e com o sistema/serviço do banco rodando.","No caixa com problema, faça um ping no nome ou IP do servidor (ex.: \u003ccode>ping 192.168.0.10\u003c/code>).","Se o ping não responder, confira cabos e o switch.","Se o ping responder mas o sistema não conecta, o Windows pode ter ativado o firewall depois de uma atualização. Chame o suporte."]},{"cmd":"ping 192.168.0.10"},{"warn":"Não desligue o servidor no meio do expediente: todos os caixas param."}]},{"id":"cmd-admin","cat":"windows","sis":"geral","titulo":"Abrir o Prompt de Comando como administrador","lead":"Vários procedimentos desta central pedem o Prompt de Comando com permissão de administrador.","tags":"cmd prompt administrador executar como admin","corpo":[{"steps":["Clique no botão \u003cb>Iniciar\u003c/b> do Windows.","Digite \u003cb>cmd\u003c/b>.","Em \u003cb>Prompt de Comando\u003c/b>, clique com o botão direito → \u003cb>Executar como administrador\u003c/b>.","Clique em \u003cb>Sim\u003c/b> na janela de confirmação.","O título da janela deve começar com \u003cb>Administrador:\u003c/b>."]},{"tip":"Para colar um comando no Prompt, clique com o botão direito dentro da janela preta, ou use \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>V\u003c/kbd> no Windows 10 e 11."}]},{"id":"servicos","cat":"windows","sis":"geral","titulo":"Ver e reiniciar serviços do Windows","lead":"Alguns sistemas usam serviços que precisam estar rodando (banco de dados, spooler, comunicação fiscal).","tags":"serviços services.msc reiniciar serviço parado","corpo":[{"cmd":"services.msc"},{"steps":["Aperte \u003ckbd>Win\u003c/kbd> + \u003ckbd>R\u003c/kbd>, digite \u003ccode>services.msc\u003c/code> e dê \u003ckbd>Enter\u003c/kbd>.","Procure o serviço pelo nome (ex.: \u003cb>Spooler de Impressão\u003c/b>).","Clique com o botão direito → \u003cb>Reiniciar\u003c/b>.","Confira se o \u003cb>Tipo de inicialização\u003c/b> está como \u003cb>Automático\u003c/b>."]},{"warn":"Não pare serviços que você não conhece. Se não souber qual é o serviço do seu sistema, pergunte ao suporte."}]},{"id":"pallas-nao-abre","cat":"pallas","sis":"pallas","titulo":"Pallas Caixa não abre ou fecha sozinho","lead":"Verificações rápidas antes de chamar o suporte.","tags":"pallas não abre fecha travou trava erro ao abrir","corpo":[{"steps":["Reinicie o computador (reiniciar, não só desligar a tela).","Se a loja tem servidor, confira se ele está ligado e se outros caixas abrem o Pallas. Veja \u003ca href=\"#pallas-servidor\">Caixas não abrem: servidor Pallas\u003c/a>.","Confira se o antivírus não colocou algum arquivo do Pallas em quarentena.","Abra o Pallas clicando com o botão direito → \u003cb>Executar como administrador\u003c/b> e veja se a mensagem muda.","Se aparecer uma mensagem de erro, tire um print e envie ao suporte."]},{"tip":"Erros que aparecem logo depois de uma atualização do Windows costumam ser de permissão ou firewall. O suporte resolve por acesso remoto."}]},{"id":"pallas-producao","cat":"pallas","sis":"pallas","titulo":"Pedido não imprime na cozinha/bar (Pallas)","lead":"O pedido aparece no caixa mas não sai na impressora de produção.","tags":"pallas cozinha bar produção kds pedido não imprime garçom","corpo":[{"steps":["Confira se a impressora da cozinha está ligada, com papel e com a luz de rede acesa.","Faça o teste de \u003ca href=\"#impressora-rede\">impressora de rede\u003c/a> (ping no IP).","No cadastro do produto, confira para qual setor de impressão (cozinha, bar, copa) ele está direcionado. Produto novo sem setor não imprime em lugar nenhum.","Se usa tela de cozinha (KDS), confira se a tela está ligada e conectada à mesma rede.","Reinicie o spooler no computador que envia os pedidos (\u003ca href=\"#spooler\">veja como\u003c/a>)."]}]},{"id":"pallas-smartpos","cat":"pallas","sis":"pallas","titulo":"Pallas na maquininha (SmartPOS): nota não emite","lead":"Para quem usa o Pallas PDV direto na maquininha de cartão.","tags":"pallas smartpos maquininha pos nfce android wifi chip","corpo":[{"steps":["Confira se a maquininha está com Wi-Fi conectado ou chip com sinal de dados.","Confira a data e a hora da maquininha.","Feche o aplicativo do Pallas e abra de novo.","Reinicie a maquininha segurando o botão de ligar.","Se continuar, verifique se há atualização do app pendente e chame o suporte."]},{"warn":"Não limpe os dados do aplicativo nem desinstale: vendas ainda não sincronizadas podem ser perdidas."}]},{"id":"mentora-carga","cat":"mentora","sis":"mentora","titulo":"Produto alterado no ERP não aparece no PDV (Mentora)","lead":"Cadastrou ou mudou preço no ERP e o caixa continua com o dado antigo? Falta fazer a carga no PDV.","tags":"mentora carga pdv produto preço não aparece atualizar favoritos","corpo":[{"steps":["Confira se o cadastro foi salvo no ERP (retaguarda).","No PDV do Mentora, use a opção de \u003cb>carga\u003c/b> / atualizar dados do PDV.","Aguarde terminar sem fechar o sistema.","Pesquise o produto de novo no caixa."]},{"tip":"Para o produto aparecer na tela de favoritos do PDV, marque a opção \u003cb>Exibe lista no PDV\u003c/b> no cadastro do produto no ERP e faça a carga."}]},{"id":"mentora-offline","cat":"mentora","sis":"mentora","titulo":"PDV Mentora funcionando off-line","lead":"O PDV do Mentora continua vendendo sem internet e sincroniza quando a conexão volta.","tags":"mentora offline sem internet sincronizar vendas","corpo":[{"p":"Sem internet, você pode continuar vendendo normalmente. As vendas ficam guardadas no computador do caixa."},{"steps":["Quando a internet voltar, deixe o PDV aberto por alguns minutos para sincronizar.","Confira no ERP se as vendas do período apareceram.","Se houver NFC-e em contingência, veja \u003ca href=\"#contingencia-mentora\">Enviar notas em contingência no Mentora\u003c/a>."]},{"warn":"Não formate nem troque o computador do caixa enquanto houver vendas não sincronizadas."}]},{"id":"mentora-atualizacao","cat":"mentora","sis":"mentora","titulo":"Atualização do PDV Mentora","lead":"O PDV do Mentora se atualiza automaticamente. Veja o que fazer se a atualização travar.","tags":"mentora atualização versão atualizar travou","corpo":[{"steps":["Mantenha o computador conectado à internet ao abrir o PDV.","Aguarde a atualização terminar antes de começar a vender.","Se travar, feche o PDV, reinicie o computador e abra de novo.","Se o antivírus bloquear o novo executável, libere a pasta do Mentora ou chame o suporte."]}]},{"id":"saurus-reinstalar","cat":"saurus","sis":"saurus","titulo":"Baixar e reinstalar o Saurus PDV","lead":"Os instaladores oficiais ficam na página de suporte da Saurus.","tags":"saurus instalar reinstalar download versão estável framework formatou","corpo":[{"steps":["Acesse \u003cb>saurus.com.br/suporte\u003c/b>.","Escolha sempre a versão marcada como \u003cb>Estável\u003c/b>.","\u003cb>Primeira instalação\u003c/b>: use quando o computador foi formatado. Instala o PDV, o Framework e o banco de dados.","\u003cb>Reinstalação\u003c/b>: baixa só o Saurus PDV, para corrigir o programa sem mexer no resto."]},{"cmd":"https://saurus.com.br/suporte"},{"videos":[["Instalação, ativação e configurações do Saurus PDV","https://www.youtube.com/watch?v=IT0lc5UtXp4"],["Ativação
